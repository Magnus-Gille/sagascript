name: Set up the CI toolchain
description: >-
  The preamble of every ci.yml lane (#358): Python, the Rust toolchain, Node.js, the Rust
  dependency cache, the downloaded-model cache of the native build lanes and `npm ci`. The job
  checks out the repository first, so this action always comes from the revision under test.
  The toolchain and Node versions are pinned here once; scripts/test-rust-toolchain-pin.mjs
  holds them to rust-toolchain.toml and .nvmrc.

inputs:
  python:
    description: Install Python 3.12 (the dictation and diarization tests, the JSON stream verifier).
    default: "true"
  rust:
    description: >-
      "true" installs the pinned Rust toolchain. "msrv" installs the one `rust-version` declares
      (minimal profile) and exports RUSTUP_TOOLCHAIN for every later step (#353). "false" installs none.
    default: "true"
  rust-components:
    description: Extra toolchain components, comma separated (clippy, rustfmt).
    default: ""
  cache-key:
    description: >-
      Swatinem/rust-cache shared-key. Lanes that compile alike share one; rust-cache keeps OS and target
      entries apart. Unless `native-build` is set, the hash of scripts/ci/cargo-gates.mjs is appended: the
      cache holds what the gates compile, and rust-cache saves only when its key is new, so a changed gate
      list needs a new key to get its artifacts cached.
    required: true
  cache-workspaces:
    description: Cargo workspaces to cache, one per line. The standalone ORT engine host is its own workspace (#357).
    default: src-tauri
  native-build:
    description: >-
      The lane builds the native release binary and runs the CLI smoke tests (the macOS and Windows build
      lanes): it caches the models they download, and its Rust cache key leaves out the gate list, which
      such a lane never runs, so a gate change does not evict its cache.
    default: "false"
  linux-deps:
    description: Install the Tauri system libraries and xdotool with apt (Linux lanes that compile the app crate).
    default: "false"
  npm-ci:
    description: Run `npm ci`. test-windows turns it off to run its build identity gates first, then installs.
    default: "true"

outputs:
  models-cache-hit:
    description: The native build lanes' model cache restored its exact key ("true"); nothing to save then.
    value: ${{ steps.models-cache.outputs.cache-hit }}
  models-cache-key:
    description: The model cache's primary key, for the lane's own save step on main.
    value: ${{ steps.models-cache.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    # The downloaded .deb files are cached (SAGA-546): the Azure mirror sometimes serves the ~60 MB at
    # 66 kB/s. apt still runs `update` and resolves and verifies as before; a miss or a failed restore
    # downloads as before. The key names the image, whose package index decides the versions, and the
    # package list (in the script, so its hash). Only main saves; pull requests restore only.
    - if: ${{ inputs.linux-deps == 'true' }}
      name: Compute the apt cache key
      id: apt-key
      shell: bash
      env:
        PACKAGES_HASH: ${{ hashFiles('scripts/ci/apt-install-tauri-deps.sh') }}
      run: |
        echo "key=apt-debs-v1-${RUNNER_OS}-${ImageOS:-unknown}-${ImageVersion:-unknown}-${PACKAGES_HASH}" >> "$GITHUB_OUTPUT"
        echo "dir=${RUNNER_TEMP}/apt-debs" >> "$GITHUB_OUTPUT"

    - if: ${{ inputs.linux-deps == 'true' }}
      name: Restore apt packages cache
      id: apt-cache
      continue-on-error: true
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.apt-key.outputs.dir }}
        key: ${{ steps.apt-key.outputs.key }}

    - if: ${{ inputs.linux-deps == 'true' }}
      name: Install Tauri system dependencies
      shell: bash
      env:
        APT_DEB_CACHE_DIR: ${{ steps.apt-key.outputs.dir }}
      # Retries and a per-attempt time limit bound a stalled mirror (SAGA-546); the package list is in the script.
      run: bash scripts/ci/apt-install-tauri-deps.sh

    - if: ${{ inputs.linux-deps == 'true' && success() && github.ref == 'refs/heads/main' && steps.apt-cache.outputs.cache-hit != 'true' }}
      name: Save apt packages cache
      continue-on-error: true
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.apt-key.outputs.dir }}
        key: ${{ steps.apt-key.outputs.key }}

    - if: ${{ inputs.python == 'true' }}
      name: Select evaluation Python runtime
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - if: ${{ inputs.rust == 'true' }}
      name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1; toolchain must match rust-toolchain.toml
      with:
        toolchain: 1.99.0
        components: ${{ inputs.rust-components }}

    - if: ${{ inputs.rust == 'msrv' }}
      name: Install the declared MSRV toolchain
      shell: bash
      run: |
        msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml)
        ort_msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' src-tauri/engine-host/ort/Cargo.toml)
        test -n "$msrv"
        test "$msrv" = "$ort_msrv"
        rustup toolchain install "$msrv" --profile minimal
        echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
        echo "Checking against Rust $msrv"

    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm

    # whisper.cpp targets Apple silicon's apple-m1 baseline, not the runner's CPU; before the Rust cache,
    # whose key includes CMAKE_* variables (scripts/cmake/macos-arm64-portable.cmake).
    - if: ${{ runner.os == 'macOS' }}
      name: Use the portable whisper.cpp CPU baseline
      shell: bash
      run: bash scripts/ci/use-portable-whisper-macos.sh

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # Only main saves (SAGA-546). A cache saved from refs/pull/N/merge or a tag is scoped to that
        # ref and no other run can restore it, yet one PR run saved 4 GB and evicted the main-branch
        # entries every PR restores from (the repository limit is 10 GB). Pull requests, tags and other
        # branches only restore; pushes to main save, so the shared entries stay fresh. The key rules
        # above are unchanged.
        save-if: ${{ github.ref == 'refs/heads/main' }}
        workspaces: ${{ inputs.cache-workspaces }}
        shared-key: ${{ inputs.cache-key }}${{ inputs.native-build != 'true' && format('-{0}', hashFiles('scripts/ci/cargo-gates.mjs')) || '' }}

    # Restore only (SAGA-546): a composite action has no post-job step, so the native build lanes save the
    # models themselves as their last step, on main, after the smoke tests downloaded what was missing
    # (outputs models-cache-*). The combined actions/cache saved under every pull request ref.
    - if: ${{ inputs.native-build == 'true' }}
      name: Cache downloaded models
      id: models-cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ runner.os == 'Windows' && '~\AppData\Roaming\Sagascript\Models' || '~/Library/Application Support/Sagascript/Models' }}
        key: ${{ runner.os == 'Windows' && 'windows' || 'macos' }}-models-${{ hashFiles('src-tauri/crates/sagascript-core/src/models/sources.rs', 'src-tauri/crates/sagascript-core/src/transcription/model.rs', 'src-tauri/crates/sagascript-core/src/diarization/model.rs') }}
        restore-keys: |
          ${{ runner.os == 'Windows' && 'windows' || 'macos' }}-models-

    - if: ${{ inputs.npm-ci == 'true' }}
      name: Install npm dependencies
      shell: bash
      run: npm ci
