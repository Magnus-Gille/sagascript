name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      # Same rust-cache scheme as CI (#178): per-crate fingerprints shared
      # across branches instead of a `Cargo.lock`-keyed multi-GB target dump.
      # `build-macos` below uses the same shared key so the release Tauri
      # build reuses dependencies this gate job just compiled.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, pinned (#180 review: release handles signing credentials)
        with:
          workspaces: src-tauri
          shared-key: sagascript-release

      # The inference gates re-download `nb-whisper-tiny`, `tiny` and the
      # diarization models every run (#178). Dedicated release primary key:
      # sharing CI's exact key would exact-hit on the smaller CI model set and
      # then skip saving the release additions, so they would never persist.
      # The CI key stays as fallback (same hash → PR-warmed `nb-whisper-tiny`
      # carries over). Note: caches are tag-scoped, so each new tag downloads
      # the release-only models once; same-tag reruns are warm.
      - name: Cache downloaded models
        uses: actions/cache@v5
        with:
          path: ~/Library/Application Support/Sagascript/Models
          key: macos-models-release-${{ hashFiles('src-tauri/crates/sagascript-core/src/settings/manager.rs', 'src-tauri/crates/sagascript-core/src/transcription/model.rs', 'src-tauri/crates/sagascript-core/src/diarization/model.rs') }}
          restore-keys: |
            macos-models-release-
            macos-models-

      # The diarization fixture is re-downloaded from Hugging Face every run
      # (#178). RUNNER_TEMP is per-run, so the cache lives in a stable path
      # and is copied into place; actions/cache persists it post-job.
      - name: Cache diarization fixture
        uses: actions/cache@v5
        with:
          path: ~/sagascript-fixture-cache
          key: diarization-fixture-dj_2022_feu-6b63943

      - name: Install npm dependencies
        run: npm ci

      - name: Verify release metadata and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:check

      - name: Test deterministic release helpers
        run: |
          ./scripts/test-verify-audio-entitlement.sh
          node scripts/test-generate-updater-manifest.mjs
          en_sort=$(LC_ALL=en_US.UTF-8 node scripts/generate-third-party-notices.mjs --test-sort)
          sv_sort=$(LC_ALL=sv_SE.UTF-8 node scripts/generate-third-party-notices.mjs --test-sort)
          [[ "$en_sort" == "$sv_sort" ]]
          node scripts/generate-third-party-notices.mjs --test-npm-installation

      - name: Verify third-party notices
        run: npm run licenses:check

      - name: Test frontend release surface
        run: npm run test:frontend

      - name: Build fresh frontend
        run: npm run build

      - name: Check Svelte and TypeScript
        run: npm run check

      - name: Test Rust workspace
        working-directory: src-tauri
        run: cargo test --workspace

      - name: Lint Rust workspace
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Same explicit triple as `build-macos` below (#178): the shared
      # rust-cache key covers one target dir, so building the gate binary
      # here lets the release Tauri build reuse these compiled dependencies
      # instead of compiling them cold. macos-14 runners are aarch64, so no
      # extra rustup target is needed.
      - name: Build release CLI for inference smoke tests
        working-directory: src-tauri
        run: cargo build --release --target aarch64-apple-darwin -p sagascript-cli

      - name: Gate real transcription
        run: |
          binary=src-tauri/target/aarch64-apple-darwin/release/sagascript
          stdout="$RUNNER_TEMP/transcription-smoke.json"
          stderr="$RUNNER_TEMP/transcription-smoke.stderr"
          "$binary" download-model nb-whisper-tiny
          "$binary" transcribe \
            --language no \
            --model nb-whisper-tiny \
            --beam 0 \
            --json \
            test-audio/norwegian-short-3s.mp3 > "$stdout" 2> "$stderr"
          python3 scripts/verify-json-cli-streams.py "$stdout" "$stderr"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert "storting" in d["text"].lower(); assert d["language"] == "no"; assert d["segments"]' "$stdout"

      - name: Gate real two-speaker diarization
        run: |
          binary=src-tauri/target/aarch64-apple-darwin/release/sagascript
          fixture="$RUNNER_TEMP/dj_2022_feu.m4a"
          result="$RUNNER_TEMP/diarization-smoke.json"
          "$binary" download-model tiny
          "$binary" download-model diarization
          fixture_cache="$HOME/sagascript-fixture-cache/dj_2022_feu.m4a"
          mkdir -p "$HOME/sagascript-fixture-cache"
          if [[ -f "$fixture_cache" ]]; then
            cp "$fixture_cache" "$fixture"
          else
            curl --fail --location --retry 3 \
              'https://huggingface.co/datasets/medkit/simsamu/resolve/6b639431f658d636c30dbf342074d723bf303e0f/dj_2022_feu/dj_2022_feu.m4a' \
              --output "$fixture"
            cp "$fixture" "$fixture_cache"
          fi
          "$binary" transcribe \
            --language auto \
            --model tiny \
            --diarize \
            --diarize-threshold 0.75 \
            --json \
            "$fixture" > "$result"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); s=d["segments"]; assert len({x["speaker"] for x in s}) == 2; assert len(s) >= 2; assert all(0 <= x["start"] <= x["end"] <= d["duration_seconds"] + 0.1 for x in s)' "$result"

  build-macos:
    needs: quality-gate
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      # Shares the quality-gate shared key above (#178) so this build reuses
      # dependencies the gate just compiled instead of rebuilding from cold.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, pinned (#180 review: release handles signing credentials)
        with:
          workspaces: src-tauri
          shared-key: sagascript-release

      - name: Install npm dependencies
        run: npm ci

      - name: Build bundled Pianissimo runtime
        run: ./scripts/build-pianissimo-native-runtime.sh

      - name: Install Python for build-time model conversion
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build verified optional Pianissimo Q8 model
        run: ./scripts/prepare-pianissimo-release-model.sh

      - name: Verify release metadata and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:check

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          : "${APPLE_CERTIFICATE:?APPLE_CERTIFICATE secret is required}"
          : "${APPLE_CERTIFICATE_PASSWORD:?APPLE_CERTIFICATE_PASSWORD secret is required}"
          : "${KEYCHAIN_PASSWORD:?KEYCHAIN_PASSWORD secret is required}"
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/sagascript-build.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"

      - name: Sign bundled Pianissimo native libraries
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: python3 scripts/sign-pianissimo-runtime.py build/pianissimo-native-runtime

      - name: Prepare notarization credentials and build metadata
        env:
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          : "${APPLE_API_PRIVATE_KEY_BASE64:?APPLE_API_PRIVATE_KEY_BASE64 secret is required}"
          : "${APPLE_API_KEY:?APPLE_API_KEY secret is required}"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
          echo "SAGASCRIPT_GIT_HASH=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_ENV"
          echo "SAGASCRIPT_BUILD_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple Apple Silicon app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          SAGASCRIPT_UPDATER_PUBKEY: ${{ vars.SAGASCRIPT_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          : "${APPLE_SIGNING_IDENTITY:?APPLE_SIGNING_IDENTITY secret is required}"
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER secret is required}"
          : "${SAGASCRIPT_UPDATER_PUBKEY:?SAGASCRIPT_UPDATER_PUBKEY variable is required}"
          : "${TAURI_SIGNING_PRIVATE_KEY:?TAURI_SIGNING_PRIVATE_KEY secret is required}"
          npx tauri build --target aarch64-apple-darwin --config scripts/tauri-pianissimo-bundle.json

      - name: Notarize app and disk image
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER secret is required}"
          : "${APPLE_API_KEY:?APPLE_API_KEY secret is required}"
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sagascript.app"
          app_zip="$RUNNER_TEMP/Sagascript-notarization.zip"
          ditto -c -k --keepParent "$app" "$app_zip"
          xcrun notarytool submit "$app_zip" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          [[ -n "$dmg" ]]
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"

      - name: Verify macOS release artifact
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(node -p "require('./package.json').version")
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sagascript.app"
          dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          [[ -n "$dmg" ]]
          ./scripts/verify-macos-release.sh "$app" "$dmg" "$version"
          updater_bundle="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sagascript.app.tar.gz"
          updater_signature="$updater_bundle.sig"
          tar -czf "$updater_bundle" -C "$(dirname "$app")" "$(basename "$app")"
          rm -f "$updater_signature"
          npx tauri signer sign "$updater_bundle"
          [[ -s "$updater_bundle" && -s "$updater_signature" ]]
          archive_check="$RUNNER_TEMP/sagascript-updater-archive-check"
          mkdir -p "$archive_check"
          tar -xzf "$updater_bundle" -C "$archive_check"
          xcrun stapler validate "$archive_check/Sagascript.app"
          spctl --assess --type execute --verbose=2 "$archive_check/Sagascript.app"
          mkdir -p artifacts
          cp "$dmg" artifacts/Sagascript.dmg
          cp "$updater_bundle" artifacts/Sagascript.app.tar.gz
          cp "$updater_signature" artifacts/Sagascript.app.tar.gz.sig
          cp build/pianissimo-sv-q8-melfix.gguf artifacts/pianissimo-sv-q8-melfix.gguf
          node scripts/generate-updater-manifest.mjs \
            "$version" artifacts/Sagascript.app.tar.gz artifacts/Sagascript.app.tar.gz.sig artifacts/latest.json

      - name: Gate upgrade and installed CLI transcription
        run: |
          version=$(node -p "require('./package.json').version")
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sagascript.app"

          # Seed an obsolete executable at the normal installation path, then
          # perform the same replace operation expected when upgrading the app.
          # The persistent /usr/local/bin link must consequently execute the
          # newly installed app-bundle binary, never the stale placeholder.
          sudo mkdir -p /Applications/Sagascript.app/Contents/MacOS /usr/local/bin
          printf '#!/bin/sh\necho stale-install\n' > "$RUNNER_TEMP/stale-sagascript"
          chmod +x "$RUNNER_TEMP/stale-sagascript"
          sudo cp "$RUNNER_TEMP/stale-sagascript" /Applications/Sagascript.app/Contents/MacOS/sagascript
          sudo ln -sfn /Applications/Sagascript.app/Contents/MacOS/sagascript /usr/local/bin/sagascript
          sudo rm -rf /Applications/Sagascript.app
          sudo ditto "$app" /Applications/Sagascript.app

          ./scripts/smoke-installed-macos-cli.sh \
            "$version" \
            "${SAGASCRIPT_GIT_HASH}" \
            test-audio/norwegian-short-3s.mp3

      - name: Gate signed Pianissimo transcription
        run: |
          mkdir -p "$HOME/Library/Application Support/Sagascript/Models"
          cp build/pianissimo-sv-q8-melfix.gguf "$HOME/Library/Application Support/Sagascript/Models/"
          /usr/local/bin/sagascript transcribe --language sv --model pianissimo-sv --json \
            test-audio/english-jfk.wav > "$RUNNER_TEMP/pianissimo-signed-smoke.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert "country" in d["text"].lower(); assert d["segments"]' \
            "$RUNNER_TEMP/pianissimo-signed-smoke.json"
          rm "$HOME/Library/Application Support/Sagascript/Models/pianissimo-sv-q8-melfix.gguf"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: |
            artifacts/Sagascript.dmg
            artifacts/Sagascript.app.tar.gz
            artifacts/Sagascript.app.tar.gz.sig
            artifacts/latest.json
            artifacts/pianissimo-sv-q8-melfix.gguf
          if-no-files-found: error

  publish-release:
    needs: build-macos
    runs-on: ubuntu-latest
    # Sole writer: publishes the draft release. All other jobs run read-only.
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename artifacts to stable filenames
        run: |
          cp artifacts/macos-bundle/Sagascript.dmg artifacts/Sagascript.dmg
          cp artifacts/macos-bundle/Sagascript.app.tar.gz artifacts/Sagascript.app.tar.gz
          cp artifacts/macos-bundle/Sagascript.app.tar.gz.sig artifacts/Sagascript.app.tar.gz.sig
          cp artifacts/macos-bundle/latest.json artifacts/latest.json
          cp artifacts/macos-bundle/pianissimo-sv-q8-melfix.gguf artifacts/pianissimo-sv-q8-melfix.gguf

          (cd artifacts && sha256sum Sagascript.dmg Sagascript.app.tar.gz Sagascript.app.tar.gz.sig latest.json pianissimo-sv-q8-melfix.gguf > SHA256SUMS)

          echo "Stable artifacts:"
          ls -lh artifacts/Sagascript* artifacts/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/Sagascript.dmg
            artifacts/Sagascript.app.tar.gz
            artifacts/Sagascript.app.tar.gz.sig
            artifacts/latest.json
            artifacts/pianissimo-sv-q8-melfix.gguf
            artifacts/SHA256SUMS
