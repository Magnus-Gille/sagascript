name: Release

# Tag path. Preferred: promote the artifacts that prebuild-release.yml already
# built, signed, notarized and verified on main for this exact commit (no
# rebuild, no repeated quality gate), then verify the resulting draft.
# Fallback (no successful prebuild for the tagged commit): the original full
# gate + build + publish path, unchanged in behaviour.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  locate-prebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # gh run list/view and the run artifacts API
    outputs:
      found: ${{ steps.locate.outputs.found }}
      run_id: ${{ steps.locate.outputs.run_id }}
    steps:
      # Only an unmodified push-to-main prebuild for exactly this commit
      # qualifies; the tree and hashes are verified again before publishing.
      - name: Find successful prebuild for the tagged commit
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_SHA: ${{ github.sha }}
        run: |
          # A "successful" prebuild run can also be an all-skipped one (version already
          # tagged), so require that the manifest job actually ran and succeeded.
          run_id=
          reason=
          for event in push workflow_dispatch; do
            for candidate in $(gh run list -R "$REPO" --workflow prebuild-release.yml --branch main \
                --event "$event" --commit "$TAG_SHA" --status success --limit 10 \
                --json databaseId --jq '.[].databaseId'); do
              built=$(gh run view "$candidate" -R "$REPO" --json jobs \
                --jq '[.jobs[] | select(.name == "manifest" and .conclusion == "success")] | length')
              [[ "$built" == 1 ]] || continue
              # Artifacts expire (30 days); an expired or incomplete prebuild
              # must fall back to the full build instead of failing the promote.
              artifacts=$(gh api "repos/$REPO/actions/runs/$candidate/artifacts" --paginate \
                --jq '.artifacts[] | [.name, .expired] | @tsv')
              missing=
              for need in macos-bundle windows-x64-unsigned-candidate windows-arm64-unsigned-candidate release-manifest; do
                if ! grep -Fxq "$(printf '%s\tfalse' "$need")" <<<"$artifacts"; then missing="$missing $need"; fi
              done
              if [[ -z "$missing" ]]; then run_id=$candidate; break 2; fi
              reason="$reason run $candidate lacks unexpired artifacts:$missing;"
            done
          done
          if [[ -n "$run_id" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "Promoting prebuild run $run_id for $TAG_SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No usable prebuild for $TAG_SHA; using the full fallback build.${reason:+ Reason:$reason}" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Sole writer on the promote path: downloads the prebuilt artifacts, verifies
  # them against the prebuild manifest, and creates the draft releases. It also
  # re-downloads the drafts as stored by GitHub so the read-only verification
  # job can check exactly what the owner will publish.
  promote-release:
    needs: locate-prebuild
    if: needs.locate-prebuild.outputs.found == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # gh release create/download for the drafts
      actions: read # gh run download from the prebuild run
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify release metadata and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs

      - name: Download prebuilt artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PREBUILD_RUN_ID: ${{ needs.locate-prebuild.outputs.run_id }}
        run: gh run download "$PREBUILD_RUN_ID" -R "$REPO" -D prebuilt

      - name: Verify artifacts against the prebuild manifest
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/release-prebuild-manifest.mjs verify \
            --dir prebuilt \
            --manifest prebuilt/release-manifest/release-manifest.json \
            --version "$version" \
            --sha "$GITHUB_SHA" \
            --tree "$(git rev-parse 'HEAD^{tree}')"

      - name: Stage release assets
        run: |
          mac=prebuilt/macos-bundle
          mkdir -p stage/release stage/beta
          cp "$mac/Sagascript.dmg" "$mac/Sagascript.app.tar.gz" "$mac/Sagascript.app.tar.gz.sig" "$mac/latest.json" stage/release/
          (cd stage/release && sha256sum Sagascript.dmg Sagascript.app.tar.gz Sagascript.app.tar.gz.sig latest.json > SHA256SUMS)
          for arch in arm64 x64; do
            src="prebuilt/windows-$arch-unsigned-candidate"
            dest=stage/beta
            [[ "$arch" == arm64 ]] && dest=stage/release
            # arm64 also ships the portable zip (#269): 5 hashed files; x64 has 4.
            files=("Sagascript-Windows-$arch-CLI.exe" "Sagascript-Windows-$arch-Portable.exe" \
                   "Sagascript-Windows-$arch-Setup.exe" "Sagascript-Windows-$arch.msi")
            expected=4
            if [[ "$arch" == arm64 ]]; then
              files+=("Sagascript-Windows-$arch-Portable.zip")
              expected=5
            fi
            for name in "${files[@]}" "SHA256SUMS-Windows-$arch"; do
              cp "$src/$name" "$dest/$name"
            done
            (cd "$dest" && sha256sum --check --strict "SHA256SUMS-Windows-$arch")
            lines=$(wc -l < "$dest/SHA256SUMS-Windows-$arch" | tr -d ' ')
            if [[ "$lines" != "$expected" ]]; then
              echo "SHA256SUMS-Windows-$arch has $lines entries, expected $expected" >&2
              exit 1
            fi
          done
          ls -lh stage/release stage/beta

      - name: Create draft releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          beta_tag="windows-beta-$version"
          for t in "$TAG" "$beta_tag"; do
            if gh release view "$t" -R "$REPO" >/dev/null 2>&1; then
              echo "A release for $t already exists; refusing to overwrite it" >&2
              exit 1
            fi
          done
          gh release create "$TAG" -R "$REPO" --draft --verify-tag --generate-notes \
            --title "$TAG" stage/release/*
          gh release create "$beta_tag" -R "$REPO" --draft --prerelease --target "$GITHUB_SHA" \
            --title "Sagascript $version - Windows x64 beta" \
            --notes "Unsigned Windows x64 beta built from $GITHUB_SHA. GUI acceptance on x64 hardware has not been performed." \
            stage/beta/*

      - name: Collect the drafts as stored by GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          gh release download "$TAG" -R "$REPO" -D draft-assets/release
          gh release download "windows-beta-$version" -R "$REPO" -D draft-assets/windows-beta
          for arch in arm64 x64; do
            mkdir -p "draft-assets/evidence/windows-$arch"
            cp "prebuilt/windows-$arch-unsigned-candidate/windows-acceptance-ps51.json" "draft-assets/evidence/windows-$arch/"
          done

      - name: Upload drafts for verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: draft-assets
          path: draft-assets
          if-no-files-found: error
          retention-days: 7

  verify-draft:
    needs: promote-release
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download drafts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: draft-assets
          path: draft-assets

      - name: Cache Pianissimo model
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/Library/Application Support/Sagascript/Models
          key: macos-models-verify-${{ hashFiles('src-tauri/crates/sagascript-core/src/transcription/pianissimo_model.rs') }}

      - name: Verify draft release
        env:
          REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./package.json').version")
          ./scripts/verify-release-draft.sh --assets-dir draft-assets \
            --version "$version" --sha "$GITHUB_SHA" --repo "$REPO" --require-windows

  quality-gate:
    needs: locate-prebuild
    if: needs.locate-prebuild.outputs.found != 'true'
    uses: ./.github/workflows/release-quality-gate.yml
    with:
      release_tag: ${{ github.ref_name }}

  build-macos:
    needs: quality-gate
    uses: ./.github/workflows/release-build-macos.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  publish-release:
    needs: [build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Writer on the fallback path: publishes the draft release (promote-release
    # is the writer on the prebuild path). All other jobs run read-only.
    permissions:
      contents: write # softprops/action-gh-release creates the draft

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Rename artifacts to stable filenames
        run: |
          cp artifacts/macos-bundle/Sagascript.dmg artifacts/Sagascript.dmg
          cp artifacts/macos-bundle/Sagascript.app.tar.gz artifacts/Sagascript.app.tar.gz
          cp artifacts/macos-bundle/Sagascript.app.tar.gz.sig artifacts/Sagascript.app.tar.gz.sig
          cp artifacts/macos-bundle/latest.json artifacts/latest.json

          (cd artifacts && sha256sum Sagascript.dmg Sagascript.app.tar.gz Sagascript.app.tar.gz.sig latest.json > SHA256SUMS)

          echo "Stable artifacts:"
          ls -lh artifacts/Sagascript* artifacts/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2, pinned (release writer)
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/Sagascript.dmg
            artifacts/Sagascript.app.tar.gz
            artifacts/Sagascript.app.tar.gz.sig
            artifacts/latest.json
            artifacts/SHA256SUMS
