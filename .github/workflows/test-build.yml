name: Test Build

# Manual lane for clearly-marked, signed + notarized test DMGs (e.g. #171).
# Deliberately separate from release.yml: uploads a workflow artifact only and
# never creates a GitHub Release, so test builds stay off the stable channel.
# Run with: gh workflow run test-build.yml --ref <branch> [-f label=<name>]
# Heavy inference smoke tests are skipped here on purpose — the PR-gating CI
# already runs the full workspace test suites before merge.

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Short label baked into the TEST artifact filename"
        required: false
        default: "F13-F24"
        type: string

permissions:
  contents: read

jobs:
  build-macos-test:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: sagascript-test-macos-arm64

      - name: Install npm dependencies
        run: npm ci

      - name: Verify release metadata (no tag check for test builds)
        run: npm run release:check

      - name: Build bundled Pianissimo runtime
        run: ./scripts/build-pianissimo-native-runtime.sh

      - name: Install Python for build-time model conversion
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build verified optional Pianissimo Q8 model
        run: ./scripts/prepare-pianissimo-release-model.sh

      - name: Gate unsigned native Pianissimo CPU inference
        run: |
          build/pianissimo-native-runtime/bin/nemo-speech transcribe test-audio/english-jfk.wav \
            --model build/pianissimo-sv-q8-melfix.gguf --language sv --device cpu --format json \
            > "$RUNNER_TEMP/pianissimo-unsigned-smoke.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert "country" in d["text"].lower(); assert d["words"]' \
            "$RUNNER_TEMP/pianissimo-unsigned-smoke.json"

      - name: Verify third-party notices
        run: npm run licenses:check

      - name: Build fresh frontend
        run: npm run build

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          : "${APPLE_CERTIFICATE:?APPLE_CERTIFICATE secret is required}"
          : "${APPLE_CERTIFICATE_PASSWORD:?APPLE_CERTIFICATE_PASSWORD secret is required}"
          : "${KEYCHAIN_PASSWORD:?KEYCHAIN_PASSWORD secret is required}"
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/sagascript-build.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"

      - name: Sign bundled Pianissimo native libraries
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: python3 scripts/sign-pianissimo-runtime.py build/pianissimo-native-runtime

      - name: Gate signed native Pianissimo CPU inference before bundling
        run: |
          build/pianissimo-native-runtime/bin/nemo-speech transcribe test-audio/english-jfk.wav \
            --model build/pianissimo-sv-q8-melfix.gguf --language sv --device cpu --format json \
            > "$RUNNER_TEMP/pianissimo-signed-native-smoke.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert "country" in d["text"].lower(); assert d["words"]' \
            "$RUNNER_TEMP/pianissimo-signed-native-smoke.json"

      - name: Prepare notarization credentials and build metadata
        env:
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          : "${APPLE_API_PRIVATE_KEY_BASE64:?APPLE_API_PRIVATE_KEY_BASE64 secret is required}"
          : "${APPLE_API_KEY:?APPLE_API_KEY secret is required}"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$api_key_path"
          {
            echo "APPLE_API_KEY_PATH=$api_key_path"
            echo "SAGASCRIPT_GIT_HASH=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
            echo "SAGASCRIPT_BUILD_DATE=$(date -u +%F)"
          } >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple Apple Silicon app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          SAGASCRIPT_UPDATER_PUBKEY: ${{ vars.SAGASCRIPT_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          : "${APPLE_SIGNING_IDENTITY:?APPLE_SIGNING_IDENTITY secret is required}"
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER secret is required}"
          : "${SAGASCRIPT_UPDATER_PUBKEY:?SAGASCRIPT_UPDATER_PUBKEY variable is required}"
          : "${TAURI_SIGNING_PRIVATE_KEY:?TAURI_SIGNING_PRIVATE_KEY secret is required}"
          npx tauri build --config scripts/tauri-ci-prebuilt.json --config scripts/tauri-pianissimo-bundle.json --target aarch64-apple-darwin

      - name: Notarize app and disk image
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER secret is required}"
          : "${APPLE_API_KEY:?APPLE_API_KEY secret is required}"
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sagascript.app"
          app_zip="$RUNNER_TEMP/Sagascript-notarization.zip"
          ditto -c -k --keepParent "$app" "$app_zip"
          xcrun notarytool submit "$app_zip" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          [[ -n "$dmg" ]]
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"

      - name: Verify macOS test artifact and rename as TEST build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(node -p "require('./package.json').version")
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sagascript.app"
          dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          [[ -n "$dmg" ]]
          ./scripts/verify-macos-release.sh "$app" "$dmg" "$version"
          label="${{ inputs.label }}"
          sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          mkdir -p artifacts
          cp "$dmg" "artifacts/Sagascript-TEST-${label}-${sha}.dmg"
          updater_bundle="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sagascript.app.tar.gz"
          updater_signature="$updater_bundle.sig"
          tar -czf "$updater_bundle" -C "$(dirname "$app")" "$(basename "$app")"
          npx tauri signer sign "$updater_bundle"
          [[ -s "$updater_bundle" && -s "$updater_signature" ]]
          cp "$updater_bundle" "artifacts/Sagascript-TEST-${label}-${sha}.app.tar.gz"
          cp "$updater_signature" "artifacts/Sagascript-TEST-${label}-${sha}.app.tar.gz.sig"
          cp build/pianissimo-sv-q8-melfix.gguf artifacts/pianissimo-sv-q8-melfix.gguf
          (cd artifacts && shasum -a 256 Sagascript-TEST-* pianissimo-sv-q8-melfix.gguf > SHA256SUMS)
          ls -lh artifacts/

      - name: Gate signed Pianissimo transcription through installed CLI symlink
        run: |
          mkdir -p "$HOME/Library/Application Support/Sagascript/Models"
          cp build/pianissimo-sv-q8-melfix.gguf "$HOME/Library/Application Support/Sagascript/Models/"
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sagascript.app"
          cli_link="$RUNNER_TEMP/sagascript-pianissimo-cli"
          ln -s "$GITHUB_WORKSPACE/$app/Contents/MacOS/sagascript" "$cli_link"
          if ! "$cli_link" transcribe --language sv --model pianissimo-sv --json \
            test-audio/english-jfk.wav > "$RUNNER_TEMP/pianissimo-signed-smoke.json"; then
            sleep 2
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -name 'nemo-speech*.ips' \
              -print -exec sed -n '1,90p' {} \; 2>/dev/null || true
            exit 1
          fi
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert "country" in d["text"].lower(); assert d["segments"]' \
            "$RUNNER_TEMP/pianissimo-signed-smoke.json"
          rm "$HOME/Library/Application Support/Sagascript/Models/pianissimo-sv-q8-melfix.gguf"

      - name: Upload macOS test artifacts (no GitHub Release is created)
        uses: actions/upload-artifact@v4
        with:
          name: test-dmg-${{ inputs.label }}
          path: |
            artifacts/Sagascript-TEST-*
            artifacts/pianissimo-sv-q8-melfix.gguf
            artifacts/SHA256SUMS
          if-no-files-found: error
