name: SBOM

on:
  push:
    branches: [main]
  release:
    types: [published]

# Least privilege (#354): the SBOM is generated with a read-only token. Only
# the release-only `attach` job gets `contents: write`, and it runs no
# third-party tooling, just `gh release upload` of the generated files.
permissions:
  contents: read

jobs:
  sbom:
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned; toolchain must match rust-toolchain.toml
        with:
          toolchain: 1.99.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Exact versions (#354): the SBOM tools are pinned rather than resolved
      # to whatever is newest at run time; bump them deliberately.
      - name: Install cargo-sbom
        run: cargo install --locked cargo-sbom --version 0.10.0

      - name: Generate Rust SBOM (SPDX)
        working-directory: src-tauri
        run: cargo sbom --output-format spdx_json_2_3 > ../sbom-rust.spdx.json

      - name: Generate Rust SBOM (CycloneDX)
        working-directory: src-tauri
        run: cargo sbom --output-format cyclone_dx_json_1_4 > ../sbom-rust.cdx.json

      - name: Install cdxgen
        run: npm install -g @cyclonedx/cdxgen@12.8.5

      - name: Generate full-project SBOM (CycloneDX)
        run: cdxgen -o sbom-full.cdx.json -t rust,javascript --no-recurse .
        env:
          CDXGEN_DEBUG_MODE: "false"

      - name: Upload SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: |
            sbom-rust.spdx.json
            sbom-rust.cdx.json
            sbom-full.cdx.json

  attach:
    needs: sbom
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # gh release upload to the published release

    steps:
      - name: Download SBOMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom

      - name: Attach SBOMs to release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so name the repository explicitly.
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" sbom-rust.spdx.json sbom-rust.cdx.json sbom-full.cdx.json
