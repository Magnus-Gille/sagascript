name: Probe 436 (temporary, removed before the PR is ready)

# Throwaway probe for #436, pushed from claude/436-pwsh-steps and deleted in a later commit. It runs only on a
# push that changes this file. It checks, on both Windows runners the candidate workflow uses, what the
# windows-package.yml change relies on: Git Bash stops at the first failing command and finds the tools, the
# environment the ARM64 steps export survives the MSYS layer, and the pwsh native-exit preference works.
on:
  push:
    branches: [claude/436-pwsh-steps]
    paths:
      - ".github/workflows/zz-probe-436.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
          - runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1; toolchain must match rust-toolchain.toml
        with:
          toolchain: 1.99.0
          components: clippy

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      # The values the ARM64 candidate exports with GITHUB_ENV, written the same way.
      - name: Export the candidate environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          "CMAKE_CXX_FLAGS=/EHsc /utf-8" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_C_COMPILER_TARGET=aarch64-pc-windows-msvc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBCLANG_PATH=C:\sagascript-tools\llvm-20.1.8\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $policy = (Resolve-Path -LiteralPath 'scripts/cmake/windows-arm64-native.cmake').Path.Replace('\', '/')
          "CMAKE_PROJECT_INCLUDE=$policy" >> $env:GITHUB_ENV
          $PSVersionTable.PSVersion.ToString()
          $env:PROCESSOR_ARCHITECTURE

      # First run: CMAKE_CXX_FLAGS arrived as "C:/Program Files/Git/EHsc /utf-8" on both runners (MSYS path
      # conversion), so this step is expected to fail; it is kept to record that.
      - name: Under bash, tools are found and the exported environment arrives unchanged
        id: bash_env
        continue-on-error: true
        shell: bash
        working-directory: src-tauri
        run: |
          echo "bash $BASH_VERSION at $(pwd)"
          command -v bash cargo rustc npm node git
          cargo --version
          npm --version
          cat > "$RUNNER_TEMP/check-env.mjs" <<'EOF'
          const workspace = process.env.GITHUB_WORKSPACE.replaceAll("\\", "/");
          const want = {
            CMAKE_CXX_FLAGS: "/EHsc /utf-8",
            CMAKE_C_COMPILER_TARGET: "aarch64-pc-windows-msvc",
            LIBCLANG_PATH: "C:\\sagascript-tools\\llvm-20.1.8\\bin",
            CMAKE_PROJECT_INCLUDE: `${workspace}/scripts/cmake/windows-arm64-native.cmake`,
          };
          let bad = 0;
          for (const [key, value] of Object.entries(want)) {
            const got = process.env[key];
            console.log(got === value ? "same   " : "CHANGED", key, JSON.stringify(got));
            if (got !== value) bad++;
          }
          console.log("args", JSON.stringify(process.argv.slice(2)));
          process.exit(bad ? 1 : 0);
          EOF
          node "$RUNNER_TEMP/check-env.mjs" --workspace --all-targets -- -D warnings --no-default-features -p sagascript-cli

      - name: Under bash, a failing first command fails the step
        id: bash_first
        continue-on-error: true
        shell: bash
        run: |
          npm run script-that-does-not-exist
          npm --version

      - name: Under bash, a failing cargo command before a passing one fails the step
        id: bash_cargo
        continue-on-error: true
        shell: bash
        working-directory: src-tauri
        run: |
          cargo build -p package-that-does-not-exist
          cargo --version

      - name: Under pwsh with the preferences, a failing first command fails the step
        id: pwsh_header
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmd /c exit 3
          cmd /c exit 0

      # The control: GitHub's own pwsh wrapper (error preference, script, then exit with $LASTEXITCODE),
      # without the native-exit preference. This is the masking #436 is about.
      - name: Under pwsh without the preference, the same two commands go green
        id: pwsh_control
        continue-on-error: true
        shell: bash
        run: |
          printf '%s\n' "\$ErrorActionPreference = 'stop'" 'cmd /c exit 3' 'cmd /c exit 0' 'if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }' > "$RUNNER_TEMP/control.ps1"
          pwsh -command ". '$(cygpath -w "$RUNNER_TEMP/control.ps1")'"

      - name: Judge the outcomes
        if: ${{ always() }}
        shell: bash
        env:
          BASH_ENV_OUTCOME: ${{ steps.bash_env.outcome }}
          BASH_FIRST: ${{ steps.bash_first.outcome }}
          BASH_CARGO: ${{ steps.bash_cargo.outcome }}
          PWSH_HEADER: ${{ steps.pwsh_header.outcome }}
          PWSH_CONTROL: ${{ steps.pwsh_control.outcome }}
        run: |
          echo "bash, tools found and environment unchanged: $BASH_ENV_OUTCOME (failure = the environment changed)"
          echo "bash, npm run <missing> then npm --version: $BASH_FIRST (want failure)"
          echo "bash, cargo build <missing> then cargo --version: $BASH_CARGO (want failure)"
          echo "pwsh with the preferences, cmd exit 3 then exit 0: $PWSH_HEADER (want failure)"
          echo "pwsh without the preference, same: $PWSH_CONTROL (success shows the masking)"
          [ "$BASH_FIRST" = failure ] && [ "$BASH_CARGO" = failure ] && [ "$PWSH_HEADER" = failure ]
