name: Windows Package Candidate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".gitattributes"
      - ".github/workflows/windows-package.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "src/**"
      - "src-tauri/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Keep source/line backtraces for CI failures without full variable/type debug
# information in every dependency and PDB. Release profiles are unchanged.
# rust-cache includes CARGO_* environment variables in its compatibility key.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  build-windows-candidate:
    name: Build Windows ${{ matrix.architecture }} candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - architecture: arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.rust_target }}

      - name: Verify native runner architecture
        shell: pwsh
        run: |
          $hostTriple = rustc -vV | Select-String '^host:' | ForEach-Object { ($_ -split ':', 2)[1].Trim() }
          if ([string]::IsNullOrWhiteSpace($hostTriple)) {
            throw "Unable to determine the Rust host triple"
          }
          if ($hostTriple -ne '${{ matrix.rust_target }}') {
            throw "Expected native ${{ matrix.rust_target }} runner, got $hostTriple"
          }
          $runnerArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          if ($runnerArchitecture -ne '${{ matrix.architecture }}') {
            throw "Expected native ${{ matrix.architecture }} runner, got $runnerArchitecture"
          }

      - name: Install pinned LLVM for ARM64 bindgen
        if: matrix.architecture == 'arm64'
        shell: pwsh
        run: |
          # Upstream rust-bindgen#3264: LLVM 22 is incompatible with bindgen 0.71.
          $llvmUrl = 'https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-woa64.exe'
          $expectedHash = '7c4ac97eb2ae6b960ca5f9caf3ff6124c8d2a18cc07a7840a4d2ea15537bad8e'
          $installerPath = Join-Path $env:RUNNER_TEMP 'LLVM-20.1.8-woa64.exe'
          $installRoot = Join-Path $env:RUNNER_TEMP ('sagascript-llvm-20.1.8-' + [guid]::NewGuid().ToString('N'))
          $llvmBin = Join-Path $installRoot 'bin'

          Invoke-WebRequest -Uri $llvmUrl -OutFile $installerPath
          $actualHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "LLVM installer SHA256 mismatch: expected $expectedHash, got $actualHash"
          }

          New-Item -ItemType Directory -Path $installRoot -Force | Out-Null
          # NSIS requires /D to be the final, unquoted argument.
          $process = Start-Process -FilePath $installerPath -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "LLVM installer failed with exit code $($process.ExitCode)"
          }

          $clangPath = Join-Path $llvmBin 'clang-cl.exe'
          $libclangPath = Join-Path $llvmBin 'libclang.dll'
          if (-not (Test-Path -LiteralPath $clangPath -PathType Leaf)) {
            throw "Pinned LLVM clang-cl.exe is missing: $clangPath"
          }
          if (-not (Test-Path -LiteralPath $libclangPath -PathType Leaf)) {
            throw "Pinned LLVM libclang.dll is missing: $libclangPath"
          }

          $clangVersionOutput = & $clangPath --version 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned clang-cl --version failed with exit code $LASTEXITCODE"
          }
          $clangVersion = ($clangVersionOutput -join "`n").Trim()
          Write-Output $clangVersion
          if ($clangVersion -notmatch '(?m)^clang version 20\.1\.8(?:\s|$)') {
            throw "Expected clang version 20.1.8, got: $clangVersion"
          }

          $targetMatch = [regex]::Match($clangVersion, '(?m)^Target:\s*(?<target>\S+)\s*$')
          if (-not $targetMatch.Success -or $targetMatch.Groups['target'].Value -ne 'aarch64-pc-windows-msvc') {
            throw "Expected native clang target aarch64-pc-windows-msvc in clang version output"
          }

          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure native ARM64 C and C++ toolchain
        if: matrix.architecture == 'arm64'
        shell: pwsh
        run: |
          $clang = Get-Command clang-cl -ErrorAction Stop
          $ninja = Get-Command ninja -ErrorAction Stop
          & $clang.Source --version
          & $ninja.Source --version
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_CXX_FLAGS=/EHsc /utf-8" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_C_COMPILER=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_CXX_COMPILER=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_ASM_COMPILER=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_C_COMPILER_TARGET=aarch64-pc-windows-msvc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_CXX_COMPILER_TARGET=aarch64-pc-windows-msvc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Pinned Whisper's SVE implementation includes Linux-only headers.
          # Keep other native ARM features; bypass only SVE/SME positive probes.
          $policy = (Resolve-Path -LiteralPath 'scripts/cmake/windows-arm64-native.cmake').Path.Replace('\', '/')
          "CMAKE_PROJECT_INCLUDE=$policy" >> $env:GITHUB_ENV

      - name: Configure portable x64 inference baseline
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          # whisper-rs-sys forwards CMAKE_* but not GGML_* environment flags.
          # Its legacy WHISPER_NATIVE=OFF alias does not disable native probing.
          $policy = (Resolve-Path -LiteralPath 'scripts/cmake/windows-x64-portable.cmake').Path.Replace('\', '/')
          "CMAKE_PROJECT_INCLUDE=$policy" >> $env:GITHUB_ENV
          "SAGASCRIPT_WINDOWS_X64_BASELINE=avx2" >> $env:GITHUB_ENV
          Get-CimInstance Win32_Processor | Select-Object Name, Manufacturer, Architecture | ConvertTo-Json -Compress
          $features = @{
            avx2 = [System.Runtime.Intrinsics.X86.Avx2]::IsSupported
            fma = [System.Runtime.Intrinsics.X86.Fma]::IsSupported
            bmi2 = [System.Runtime.Intrinsics.X86.Bmi2]::IsSupported
            f16c = (([System.Runtime.Intrinsics.X86.X86Base]::CpuId(1, 0).Item3 -band (1 -shl 29)) -ne 0)
          }
          $features | ConvertTo-Json -Compress
          if ($features.Values -contains $false) { throw 'Runner does not support the packaged x64 CPU baseline' }

      - name: Identify Windows runner image
        id: windows-image
        shell: pwsh
        run: |
          $imageOs = $env:ImageOS
          $imageVersion = $env:ImageVersion
          if ([string]::IsNullOrWhiteSpace($imageOs)) {
            throw "ImageOS is unavailable; refusing to share native build cache"
          }
          if ([string]::IsNullOrWhiteSpace($imageVersion)) {
            throw "ImageVersion is unavailable; refusing to share native build cache"
          }
          "image_os=$imageOs" >> $env:GITHUB_OUTPUT
          "image_version=$imageVersion" >> $env:GITHUB_OUTPUT

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # arm64 CMake targets contain a per-run GUID LLVM path, so caching them can stale lld-link/llvm-mt.
          cache-targets: ${{ matrix.architecture != 'arm64' }}
          shared-key: windows-package-${{ matrix.architecture }}-${{ steps.windows-image.outputs.image_os }}-${{ steps.windows-image.outputs.image_version }}-${{ hashFiles('.github/workflows/windows-package.yml', 'scripts/cmake/windows-x64-portable.cmake', 'scripts/cmake/windows-arm64-native.cmake', 'scripts/verify-windows-x64-cpu-policy.ps1') }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      # Keep the candidate's larger model set under its own primary key. A
      # regular CI cache may restore the Norwegian smoke model, but the
      # candidate run must still save its additional base.en artifact.
      # `download-model` verifies every restored file against the immutable
      # manifest before using it; this path contains models only, never app
      # settings or logs.
      - name: Cache downloaded models
        uses: actions/cache@v5
        with:
          path: ~\AppData\Roaming\Sagascript\Models
          key: windows-models-package-${{ matrix.architecture }}-${{ hashFiles('src-tauri/crates/sagascript-core/src/settings/manager.rs', 'src-tauri/crates/sagascript-core/src/transcription/model.rs', 'src-tauri/crates/sagascript-core/src/diarization/model.rs') }}
          restore-keys: |
            windows-models-package-${{ matrix.architecture }}-
            windows-models-

      - name: Pin validated Windows build identity
        run: node scripts/ci-build-identity.mjs --initialize

      - name: Install npm dependencies
        run: npm ci

      - name: Verify release metadata and licenses
        run: |
          npm run release:check
          npm run licenses:check

      - name: Test frontend release surface
        run: npm run test:frontend

      - name: Build and check frontend
        run: |
          npm run build
          npm run check

      - name: Test and lint Rust workspace
        working-directory: src-tauri
        run: |
          cargo check --workspace
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo build -p sagascript-cli --no-default-features

      - name: Gate native Windows clipboard transactions
        shell: pwsh
        run: |
          # The host triple was verified above. Reuse the workspace test binary
          # instead of recompiling a duplicate explicit-target debug tree.
          cargo test --manifest-path src-tauri/Cargo.toml -p sagascript native_runner_clipboard_transaction_smoke -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "Native clipboard transaction gate failed" }

      - name: Verify debug x64 inference CPU policy
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: ./scripts/verify-windows-x64-cpu-policy.ps1 -TargetRoot src-tauri/target -PolicyFile scripts/cmake/windows-x64-portable.cmake

      - name: Verify debug ARM64 native CPU flags
        if: matrix.architecture == 'arm64'
        run: node scripts/report-windows-arm64-native.mjs src-tauri/target

      - name: Verify source before release CLI build
        run: node scripts/ci-build-identity.mjs --verify

      - name: Gate real Windows transcription
        env:
          CARGO_LOG: cargo::core::compiler::fingerprint=info
        shell: pwsh
        run: |
          cargo build --release -p sagascript-cli --manifest-path src-tauri/Cargo.toml --target ${{ matrix.rust_target }}
          if ($LASTEXITCODE -ne 0) { throw "Release CLI build failed" }
          if ('${{ matrix.architecture }}' -eq 'x64') {
            ./scripts/verify-windows-x64-cpu-policy.ps1 -TargetRoot src-tauri/target -PolicyFile scripts/cmake/windows-x64-portable.cmake
          }
          $binary = "src-tauri\target\${{ matrix.rust_target }}\release\sagascript.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "transcription-smoke.json"
          $stderr = Join-Path $env:RUNNER_TEMP "transcription-smoke.stderr"
          & $binary download-model nb-whisper-tiny
          if ($LASTEXITCODE -ne 0) { throw "Model download failed with exit code $LASTEXITCODE" }
          & $binary download-model nb-whisper-tiny
          if ($LASTEXITCODE -ne 0) { throw "Existing model verification failed with exit code $LASTEXITCODE" }
          & $binary transcribe `
            --language no `
            --model nb-whisper-tiny `
            --beam 0 `
            --json `
            test-audio/norwegian-short-3s.mp3 > $stdout 2> $stderr
          if ($LASTEXITCODE -ne 0) {
            $transcriptionExit = $LASTEXITCODE
            Write-Host "Transcription stdout:"
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host "Transcription stderr:"
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "Transcription failed with exit code $transcriptionExit"
          }
          python scripts/verify-json-cli-streams.py $stdout $stderr
          $result = Get-Content $stdout -Raw | ConvertFrom-Json
          if ($result.language -ne "no") { throw "Expected Norwegian result, got '$($result.language)'" }
          if ($result.text -notmatch "(?i)storting") { throw "Expected 'storting' in transcription" }
          if (-not $result.segments) { throw "Expected at least one transcription segment" }
          Copy-Item $binary (Join-Path $env:RUNNER_TEMP "sagascript-cli.exe")

      - name: Gate repeated English dictation with warm model reuse
        shell: pwsh
        run: |
          $binary = "src-tauri\target\${{ matrix.rust_target }}\release\sagascript.exe"
          & $binary download-model base.en
          if ($LASTEXITCODE -ne 0) { throw "English model download failed" }
          & $binary benchmark-dictation test-audio/english-jfk.wav --language en --iterations 5 --expect-word country > "$env:RUNNER_TEMP\english-dictation-benchmark.json"
          if ($LASTEXITCODE -ne 0) { throw "Repeated English dictation failed" }

      - name: Test Windows PowerShell 5.1 acceptance
        shell: powershell
        run: |
          ./scripts/accept-windows-candidate.ps1 -CliExe "src-tauri\target\${{ matrix.rust_target }}\release\sagascript.exe" -ExpectedVersion (Get-Content package.json -Raw | ConvertFrom-Json).version -Fixture test-audio/norwegian-short-3s.mp3 -OutputPath "$env:RUNNER_TEMP\windows-acceptance-ps51.json"
          if (-not (Test-Path "$env:RUNNER_TEMP\windows-acceptance-ps51.json")) { throw "Missing PS5.1 acceptance evidence" }

      - name: Build and stage ARM64 ONNX engine host
        if: matrix.architecture == 'arm64'
        shell: pwsh
        run: |
          $ortVersion = '1.28.2'
          $ortZipName = "onnxruntime-win-arm64-$ortVersion.zip"
          $ortUrl = "https://github.com/microsoft/onnxruntime/releases/download/v$ortVersion/$ortZipName"
          $expectedHash = 'a3ab2265e52d157ef1c4f4f82f66fc582ce12a780510aac240690ce194b58510'
          $sha = (git rev-parse HEAD).Trim()
          $env:SAGASCRIPT_GIT_SHA = $sha

          cargo build --release --manifest-path src-tauri/engine-host/ort/Cargo.toml --target aarch64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Engine host build failed with exit code $LASTEXITCODE" }
          $hostExe = 'src-tauri\engine-host\ort\target\aarch64-pc-windows-msvc\release\sagascript-engine-host-ort.exe'
          if (-not (Test-Path -LiteralPath $hostExe -PathType Leaf)) { throw "Missing engine host binary: $hostExe" }

          $zipPath = Join-Path $env:RUNNER_TEMP $ortZipName
          Invoke-WebRequest -Uri $ortUrl -OutFile $zipPath
          $actualHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "ONNX Runtime zip SHA256 mismatch: expected $expectedHash, got $actualHash"
          }
          $extractRoot = Join-Path $env:RUNNER_TEMP 'ort-extract'
          if (Test-Path -LiteralPath $extractRoot) { Remove-Item -LiteralPath $extractRoot -Recurse -Force }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractRoot
          $libDir = Join-Path $extractRoot "onnxruntime-win-arm64-$ortVersion\lib"

          # build/engine-host/ is git-ignored, so staging does not dirty the pinned source identity.
          $stage = 'build\engine-host\win-arm64'
          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath $hostExe -Destination $stage
          foreach ($dll in @('onnxruntime.dll', 'onnxruntime_providers_shared.dll')) {
            $source = Join-Path $libDir $dll
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Missing $dll in $ortZipName" }
            Copy-Item -LiteralPath $source -Destination $stage
          }
          Get-ChildItem $stage | Select-Object Name, Length | Format-Table | Out-String | Write-Output
          ./scripts/verify-windows-engine-host.ps1 -HostDir $stage -ExpectedGitSha $sha

      - name: Measure warm ONNX engine host latency (informational)
        if: matrix.architecture == 'arm64'
        shell: pwsh
        run: |
          # Numbers only, no thresholds: short-utterance latency on windows-11-arm without the device.
          # A failure here is reported as a warning so a model-download hiccup cannot block the candidate.
          try {
            # The CLI only offers Pianissimo when the ONNX host sits in engine-host\ beside it,
            # as in the installed layout.
            $probeDir = Join-Path $env:RUNNER_TEMP 'latency-probe'
            New-Item -ItemType Directory -Force -Path (Join-Path $probeDir 'engine-host') | Out-Null
            Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'sagascript-cli.exe') -Destination $probeDir
            Copy-Item -Path 'build\engine-host\win-arm64\*' -Destination (Join-Path $probeDir 'engine-host')
            $cli = Join-Path $probeDir 'sagascript-cli.exe'
            & $cli download-model pianissimo-sv
            if ($LASTEXITCODE -ne 0) { throw "Pianissimo model download failed" }
            $status = & $cli engine status --json | ConvertFrom-Json
            ./scripts/benchmark-windows-engine-host.ps1 -HostDir 'build\engine-host\win-arm64' -ModelDir $status.model.dir | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'engine-host-latency.txt')
          } catch {
            Write-Host "::warning::Engine host latency probe failed: $_"
          }
          $global:LASTEXITCODE = 0

      - name: Remove cached installer bundles
        shell: pwsh
        run: |
          $bundleRoot = "src-tauri\target\${{ matrix.rust_target }}\release\bundle"
          foreach ($format in @("nsis", "msi")) {
            $bundleDirectory = Join-Path $bundleRoot $format
            if (Test-Path -LiteralPath $bundleDirectory) {
              Remove-Item -LiteralPath $bundleDirectory -Recurse -Force
            }
          }

      - name: Verify source before installer build
        run: node scripts/ci-build-identity.mjs --verify

      - name: Build unsigned internal installers
        env:
          CARGO_LOG: cargo::core::compiler::fingerprint=info
        run: npx tauri build --ci --bundles nsis,msi --no-sign --target ${{ matrix.rust_target }} --config scripts/tauri-ci-prebuilt.json ${{ matrix.architecture == 'arm64' && '--config scripts/tauri-windows-engine-host.json' || '' }}

      - name: Verify packaged x64 inference CPU policy
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: ./scripts/verify-windows-x64-cpu-policy.ps1 -TargetRoot src-tauri/target -PolicyFile scripts/cmake/windows-x64-portable.cmake

      - name: Verify packaged ARM64 native CPU flags
        if: matrix.architecture == 'arm64'
        run: node scripts/report-windows-arm64-native.mjs src-tauri/target

      - name: Verify ARM64 installer carries the ONNX engine host
        if: matrix.architecture == 'arm64'
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $release = 'src-tauri\target\${{ matrix.rust_target }}\release'
          # Tauri stages resources beside the app executable; NSIS and MSI package this tree.
          ./scripts/verify-windows-engine-host.ps1 -HostDir (Join-Path $release 'engine-host') -ExpectedGitSha $sha

          # Administrative extraction unpacks the MSI without installing it.
          $msi = @(Get-ChildItem (Join-Path $release 'bundle\msi') -Filter '*.msi' -File)
          if ($msi.Count -ne 1) { throw "Expected exactly one MSI, found $($msi.Count)" }
          $extract = Join-Path $env:RUNNER_TEMP 'msi-extract'
          if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
          $process = Start-Process msiexec.exe -ArgumentList @('/a', $msi[0].FullName, '/qn', "TARGETDIR=$extract") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "MSI administrative extraction failed with exit code $($process.ExitCode)" }
          $installedHost = @(Get-ChildItem $extract -Recurse -Filter 'sagascript-engine-host-ort.exe' -File)
          if ($installedHost.Count -ne 1) { throw "Expected one engine host in MSI, found $($installedHost.Count)" }
          if ((Split-Path $installedHost[0].DirectoryName -Leaf) -ne 'engine-host') { throw "MSI engine host is not under engine-host\: $($installedHost[0].FullName)" }
          ./scripts/verify-windows-engine-host.ps1 -HostDir $installedHost[0].DirectoryName -ExpectedGitSha $sha

      - name: Verify source after installer build
        run: node scripts/ci-build-identity.mjs --verify

      - name: Prepare and verify candidate artifacts
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $architecture = "${{ matrix.architecture }}"
          $targetRoot = "src-tauri\target\${{ matrix.rust_target }}\release"
          $desktop = Join-Path $targetRoot "sagascript.exe"
          $cli = Join-Path $env:RUNNER_TEMP "sagascript-cli.exe"
          if (-not (Test-Path -LiteralPath $desktop -PathType Leaf)) {
            throw "Tauri did not produce the desktop executable at the native target path: $desktop"
          }
          $nsis = @(Get-ChildItem (Join-Path $targetRoot "bundle\nsis") -Filter "*.exe" -File)
          $msi = @(Get-ChildItem (Join-Path $targetRoot "bundle\msi") -Filter "*.msi" -File)
          if ($nsis.Count -ne 1) { throw "Expected exactly one current NSIS installer, found $($nsis.Count)" }
          if ($msi.Count -ne 1) { throw "Expected exactly one current MSI installer, found $($msi.Count)" }
          if ($nsis[0].Name -notmatch [regex]::Escape($version)) { throw "NSIS installer does not match version ${version}: $($nsis[0].Name)" }
          if ($msi[0].Name -notmatch [regex]::Escape($version)) { throw "MSI installer does not match version ${version}: $($msi[0].Name)" }

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $desktop "artifacts\Sagascript-Windows-$architecture-Portable.exe"
          Copy-Item $cli "artifacts\Sagascript-Windows-$architecture-CLI.exe"
          Copy-Item $nsis[0].FullName "artifacts\Sagascript-Windows-$architecture-Setup.exe"
          Copy-Item $msi[0].FullName "artifacts\Sagascript-Windows-$architecture.msi"
          Copy-Item "docs\windows-release.md" "artifacts\README-Windows-Candidate.md"
          Copy-Item "scripts\accept-windows-candidate.ps1" "artifacts\accept-windows-candidate.ps1"
          Copy-Item "scripts\summarize-windows-dictation.ps1" "artifacts\summarize-windows-dictation.ps1"
          if ($architecture -eq 'arm64') {
            Copy-Item "scripts\windows-arm-pianissimo-test.ps1" "artifacts\windows-arm-pianissimo-test.ps1"
            Copy-Item "docs\windows-arm-pianissimo-testing.md" "artifacts\README-Windows-ARM-Pianissimo.md"
          }
          Copy-Item "docs\windows-dictation-benchmark.md" "artifacts\README-Dictation-Metrics.md"
          Copy-Item "test-audio\norwegian-short-3s.mp3" "artifacts\norwegian-short-3s.mp3"
          Copy-Item "test-audio\english-jfk.wav" "artifacts\english-jfk.wav"
          Copy-Item "$env:RUNNER_TEMP\english-dictation-benchmark.json" "artifacts\english-dictation-benchmark.json"
          Copy-Item "$env:RUNNER_TEMP\windows-acceptance-ps51.json" "artifacts\windows-acceptance-ps51.json"

          ./scripts/verify-windows-release.ps1 `
            -CliExe "artifacts\Sagascript-Windows-$architecture-CLI.exe" `
            -ExpectedVersion $version `
            -ExpectedGitHash $env:SAGASCRIPT_GIT_HASH `
            -Artifacts @(
              "artifacts\Sagascript-Windows-$architecture-Portable.exe",
              "artifacts\Sagascript-Windows-$architecture-CLI.exe",
              "artifacts\Sagascript-Windows-$architecture-Setup.exe",
              "artifacts\Sagascript-Windows-$architecture.msi"
            ) `
            -SignaturePolicy Internal `
            -ChecksumOutput "artifacts\SHA256SUMS-Windows-$architecture"

      - name: Upload internal Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}-unsigned-candidate
          path: artifacts/
