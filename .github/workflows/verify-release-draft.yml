name: Verify existing release drafts

# Run a corrected, reviewed verifier against unchanged promoted release assets.
# This path has no release writer, signing environment, or build step.
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Original Release workflow run that successfully promoted the drafts
        required: true
        type: string
      version:
        description: Stable version, for example 1.4.5
        required: true
        type: string
      release_sha:
        description: Exact 40-character SHA from the accepted release receipt
        required: true
        type: string

      draft_manifest:
        description: Fresh provider JSON snapshot of draft IDs, flags and asset digests (see RELEASING.md)
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify-drafts:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      DRAFT_MANIFEST: ${{ inputs.draft_manifest }}
    steps:
      - name: Checkout reviewed verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate source run, exact release SHA and supplied draft snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-draft-reverification.mjs preflight

      - name: Download original promoted draft snapshot and Windows evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: draft-assets
          path: draft-assets
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}

      - name: Match every artifact file to the supplied draft asset digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-draft-reverification.mjs verify-assets

      - name: Cache Pianissimo model
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/Library/Application Support/Sagascript/Models
          key: macos-models-verify-${{ hashFiles('src-tauri/crates/sagascript-core/src/transcription/pianissimo_model.rs') }}

      - name: Verify unchanged draft release
        run: |
          ./scripts/verify-release-draft.sh --assets-dir draft-assets \
            --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --repo "$GITHUB_REPOSITORY" --require-windows

      - name: Save source and asset binding
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: draft-reverification-receipt
          path: draft-reverification-receipt.json
          if-no-files-found: warn
          retention-days: 30
