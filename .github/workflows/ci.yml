name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege (#354): no CI job writes to the repository, so the token is
# read-only. Every job also sets timeout-minutes (60 for native build/test
# lanes, 20 for the rest; at least twice the slowest observed run) instead of
# the 360-minute default.
permissions:
  contents: read

# Cancel superseded PR runs (#178): pushes to a PR share one group, so a fix
# cancels the stale run instead of burning runner-minutes compiling it twice.
# Pushes (e.g. to `main`) get a unique group per run, so a newer push can
# neither cancel an in-progress run nor replace a pending one — with the
# default single-slot queue, same-group pending runs would otherwise be
# dropped. Never touches release.yml (tag builds must never cancel).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Keep source/line backtraces for CI failures without full variable/type debug
# information in every dependency and PDB. Release profiles are unchanged.
# rust-cache includes CARGO_* environment variables in its compatibility key.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # This job is deliberately dependency-free and checks out the PR base so a
  # PR cannot change the allowlist used to decide whether native CI is needed.
  # Pushes use --full because the workflow only runs on main and no comparison
  # range is needed to keep that required path fail-closed.
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      scope_trusted: ${{ steps.classify.outputs.scope_trusted }}
      scope_classification: ${{ steps.classify.outputs.scope_classification }}
    steps:
      - name: Checkout scope policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          full_fallback() {
            echo '{"schema_version":1,"docs_only":false,"scope_trusted":true,"scope_classification":"full-required","reason":"scope-policy-or-commit-unavailable","changed_paths":[]}'
            {
              echo 'docs_only=false'
              echo 'scope_trusted=true'
              echo 'scope_classification=full-required'
            } >> "$GITHUB_OUTPUT"
          }

          if [ "$EVENT_NAME" = pull_request ]; then
            # The policy is read from the base checkout. During adoption the
            # base may predate this script; a fork head may also be absent from
            # the base repository. Both cases safely run the full CI lanes.
            if [ -f scripts/ci-docs-scope.mjs ] \
              && [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
              && [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
              && git cat-file -e "$PR_BASE_SHA^{commit}" \
              && git cat-file -e "$PR_HEAD_SHA^{commit}"; then
              node scripts/ci-docs-scope.mjs --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
            else
              full_fallback
            fi
          else
            node scripts/ci-docs-scope.mjs --full
          fi

  test-macos:
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Select evaluation Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Test offline dictation evaluation tooling
        run: python -m unittest discover -s scripts/dictation_eval -p 'test_*.py'

      - name: Test diarization reference contracts
        run: python -m unittest discover -s scripts/diarization_sv -p 'test_reference_dataset.py'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1; toolchain must match rust-toolchain.toml
        with:
          toolchain: 1.99.0
          components: clippy

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: sagascript-ci-checks

      - name: Install npm dependencies
        run: npm ci

      # npm advisories (#355): fail on a high or critical finding anywhere in
      # the root package-lock.json, dev dependencies included, since they
      # build the shipped frontend bundle. site/ and tooling/code-health/ have
      # their own lockfiles; neither ships in the app and neither is audited
      # here.
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Test frontend lifecycle helpers
        run: |
          npm run test:frontend
          node scripts/test-generate-updater-manifest.mjs
          node --test scripts/diarization_sv/test_reference_review.mjs

      - name: Install browser regression runtime
        run: npx playwright install chromium

      - name: Test transcription result tabs in browser
        env:
          QA_OUTPUT_DIR: ${{ runner.temp }}/transcription-browser
        run: npm run test:browser

      - name: Upload browser regression diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: transcription-browser-diagnostics
          path: ${{ runner.temp }}/transcription-browser
          if-no-files-found: ignore

      - name: Build frontend
        run: npm run build

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Separate invocations preserve the core no-features build; combining
      # package flags would unify features with the CLI defaults.
      - name: Cargo test (sagascript-core, no features)
        working-directory: src-tauri
        run: cargo test -p sagascript-core

      - name: Cargo test (sagascript-cli)
        working-directory: src-tauri
        run: cargo test -p sagascript-cli

      - name: Cargo test (sagascript-cli, no features)
        working-directory: src-tauri
        run: cargo test -p sagascript-cli --no-default-features

      - name: Cargo clippy (sagascript-core, no features)
        working-directory: src-tauri
        run: cargo clippy -p sagascript-core --all-targets -- -D warnings

      - name: Cargo clippy (sagascript-cli)
        working-directory: src-tauri
        run: cargo clippy -p sagascript-cli --all-targets -- -D warnings

      # Core defaults to no features. CLI defaults already include diarization
      # and are covered above; core needs this explicit feature matrix.
      - name: Cargo check (sagascript-core, diarization)
        working-directory: src-tauri
        run: cargo check -p sagascript-core --features diarization

      - name: Cargo test (sagascript-core, diarization)
        working-directory: src-tauri
        run: cargo test -p sagascript-core --features diarization

      - name: Cargo clippy (sagascript-core, diarization)
        working-directory: src-tauri
        run: cargo clippy -p sagascript-core --features diarization --all-targets -- -D warnings

      - name: Svelte check
        run: npx svelte-check --tsconfig ./tsconfig.json

      - name: Build Core ML engine host and check its revision
        run: |
          ./scripts/stage-engine-host.sh
          ./scripts/check-engine-host-identity.sh build/engine-host/sagascript-engine-host "$GITHUB_SHA"

      - name: Swift test (Core ML engine host)
        working-directory: src-tauri/engine-host/coreml
        # The tests use Swift Testing (`import Testing`), which ships with Xcode 16+;
        # the runner's default Xcode may be older, so run them with the newest one installed.
        run: |
          newest=$(find /Applications -maxdepth 1 -name "Xcode_*.app" | sort -V | tail -1)
          if [ -z "$newest" ]; then echo "No Xcode found in /Applications" >&2; exit 1; fi
          export DEVELOPER_DIR="$newest/Contents/Developer"
          echo "Swift tests with $newest"
          swift --version
          swift test

      # Engine-host protocol conformance (#367), model-free subset, against the
      # host staged above: hello, ping, status, the errors the client relies on
      # (unsupported, model_missing, not_loaded), shutdown and EOF exit. The full
      # run (load, windows, cancel) needs a Pianissimo model (see
      # docs/engine-host-protocol.md, Conformance).
      - name: Engine-host conformance, model-free subset (Core ML host)
        run: python scripts/engine-host-conformance.py build/engine-host/sagascript-engine-host --no-model

  build-macos:
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Select evaluation Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1; toolchain must match rust-toolchain.toml
        with:
          toolchain: 1.99.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: sagascript-ci-native

      - name: Cache downloaded models
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/Library/Application Support/Sagascript/Models
          key: macos-models-${{ hashFiles('src-tauri/crates/sagascript-core/src/settings/manager.rs', 'src-tauri/crates/sagascript-core/src/transcription/model.rs', 'src-tauri/crates/sagascript-core/src/diarization/model.rs') }}
          restore-keys: |
            macos-models-

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # PR validation needs the native release binary for the smoke tests, not
      # an installer. Full packaging, signing and notarization remain gated in
      # release.yml, so skipping bundling here removes duplicate work without
      # weakening native macOS coverage.

      - name: Build native release binary (no installer)
        env:
          SAGASCRIPT_UPDATER_PUBKEY: ${{ vars.SAGASCRIPT_UPDATER_PUBKEY }}
        run: npx tauri build --config scripts/tauri-ci-prebuilt.json --no-bundle

      - name: Verify native release binary
        run: |
          BINARY=src-tauri/target/release/sagascript
          [[ -x "$BINARY" ]]
          file "$BINARY"

      # --- Tier 1: CLI smoke tests (no model needed) ---

      - name: Smoke test — help and version
        run: |
          BINARY=src-tauri/target/release/sagascript
          $BINARY --help
          $BINARY transcribe --help
          $BINARY record --help

      - name: Smoke test — config management
        run: |
          BINARY=src-tauri/target/release/sagascript
          $BINARY config list
          $BINARY config get language
          $BINARY config set language sv
          $BINARY config get language | grep -q sv
          $BINARY config reset language
          $BINARY config get language | grep -q en
          $BINARY config path

      - name: Smoke test — model listing and formats
        run: |
          BINARY=src-tauri/target/release/sagascript
          $BINARY list-models
          $BINARY formats

      - name: Smoke test — shell completions
        run: |
          BINARY=src-tauri/target/release/sagascript
          $BINARY completions zsh > /dev/null
          $BINARY completions bash > /dev/null

      # --- Tier 2: Model download + transcription ---

      - name: Smoke test — download model and transcribe
        run: |
          BINARY=src-tauri/target/release/sagascript
          $BINARY download-model nb-whisper-tiny
          RESULT=$($BINARY transcribe --language no --model nb-whisper-tiny test-audio/norwegian-short-3s.mp3)
          echo "Transcription: $RESULT"
          echo "$RESULT" | grep -iq "stortinget"

      - name: Smoke test — transcribe with JSON output
        run: |
          BINARY=src-tauri/target/release/sagascript
          STDOUT="$RUNNER_TEMP/transcription-smoke.json"
          STDERR="$RUNNER_TEMP/transcription-smoke.stderr"
          $BINARY transcribe --json --language no --model nb-whisper-tiny \
            test-audio/norwegian-short-3s.mp3 > "$STDOUT" 2> "$STDERR"
          python3 scripts/verify-json-cli-streams.py "$STDOUT" "$STDERR"

  check-macos:
    needs: [scope, test-macos, build-macos]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      SCOPE_TRUSTED: ${{ needs.scope.outputs.scope_trusted }}
      DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
      TEST_RESULT: ${{ needs.test-macos.result }}
      BUILD_RESULT: ${{ needs.build-macos.result }}
    steps:
      - name: Assert macOS CI lanes passed
        run: |
          test "$SCOPE_RESULT" = success
          test "$SCOPE_TRUSTED" = true
          if [ "$DOCS_ONLY" = true ]; then
            test "$TEST_RESULT" = skipped
            test "$BUILD_RESULT" = skipped
          else
            test "$DOCS_ONLY" = false
            test "$TEST_RESULT" = success
            test "$BUILD_RESULT" = success
          fi

  test-linux:
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Select evaluation Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Test offline dictation evaluation tooling
        run: python -m unittest discover -s scripts/dictation_eval -p 'test_*.py'

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            build-essential \
            file \
            xdotool

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1; toolchain must match rust-toolchain.toml
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      # Formatting gate (#352). Both Cargo workspaces must be rustfmt-clean:
      # the main one and the standalone ORT engine host. Runs before any
      # compilation, so an unformatted PR fails early.
      - name: Check Rust formatting
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path engine-host/ort/Cargo.toml --all -- --check

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      # Same rust-cache scheme as the macOS job (#178); the shared key spans
      # branches while rust-cache keeps OS/target entries separate. The
      # standalone ORT engine host is its own Cargo workspace (#357).
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            src-tauri/engine-host/ort
          shared-key: sagascript-ci

      # Dependency policy (#355), before any compilation: RustSec advisories,
      # licenses, banned or duplicated crates and allowed sources, as set in
      # src-tauri/deny.toml, for both Cargo workspaces. The advisory database
      # is fetched at run time. rust-cache keeps the installed binary. The ORT
      # host run allows the policy entries only the main workspace uses.
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2

      - name: Check Rust dependency policy (cargo-deny)
        working-directory: src-tauri
        run: |
          cargo deny --locked --workspace check
          cargo deny --locked --manifest-path engine-host/ort/Cargo.toml --workspace check -A license-not-encountered -A license-exception-not-encountered -A unmatched-source

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # GUI build: compiles the cfg(target_os = "linux") Tauri path so it can't
      # silently break on a future PR (the macOS/Windows runners never see it).
      # The bare invocation covers the root (app) package, which pulls in
      # sagascript-core with the `record` feature.
      - name: Cargo check (GUI app)
        working-directory: src-tauri
        run: cargo check

      - name: Cargo clippy (GUI app)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Headless CLI (no Tauri) — the sagascript-cli member crate. Default
      # features include `record` (cpal/ALSA); the --no-default-features runs
      # cover the pure batch-transcribe build, which must need no ALSA.
      - name: Cargo check (headless CLI, with record)
        working-directory: src-tauri
        run: cargo check -p sagascript-cli

      - name: Cargo check (headless CLI, batch-only)
        working-directory: src-tauri
        run: cargo check -p sagascript-cli --no-default-features

      - name: Cargo clippy (headless CLI, batch-only)
        working-directory: src-tauri
        run: cargo clippy -p sagascript-cli --all-targets --no-default-features -- -D warnings

      # Clippy policy lints (#356): unwrap/expect/panic/print/size counts in
      # production code, per lint and crate, must not rise above
      # src-tauri/clippy-policy-baseline.json. It re-lints only the workspace
      # crates (workspace + batch-only CLI); dependencies come from the steps
      # above. Measures Linux code only. See CONTRIBUTING.md.
      - name: Clippy policy lints (counts must not rise)
        run: node scripts/clippy-policy.mjs

      - name: Cargo test (headless CLI, batch-only)
        working-directory: src-tauri
        run: cargo test -p sagascript-cli --no-default-features

      - name: Build batch CLI for evaluation contracts
        working-directory: src-tauri
        run: cargo build -p sagascript-cli --no-default-features

      - name: Install offline diarization evaluation test dependencies
        run: python -m pip install -r scripts/diarization_sv/requirements-evaluation.txt

      - name: Test diarization reference and evidence contracts with native identity parity
        env:
          SAGASCRIPT_REFERENCE_CLI: ${{ github.workspace }}/src-tauri/target/debug/sagascript
        run: |
          test -x "$SAGASCRIPT_REFERENCE_CLI"
          python -m unittest discover -s scripts/diarization_sv -p 'test_*.py'

      - name: Cross-check native DER and JER against independent scorers
        run: |
          curl --fail --location --retry 2 \
            https://raw.githubusercontent.com/nryant/dscore/e02f949ac6592279300a2c33d03daf9e0c12fd27/scorelib/metrics.py \
            --output "$RUNNER_TEMP/dscore-metrics.py"
          # The cross-check verifies the pinned source SHA-256 before loading
          # only its numeric JER function. No Perl runner or model inference.
          python scripts/diarization_sv/crosscheck_metrics.py \
            --binary "$GITHUB_WORKSPACE/src-tauri/target/debug/sagascript" \
            --scratch "$RUNNER_TEMP/diarization-metric-crosscheck" \
            --dscore-source "$RUNNER_TEMP/dscore-metrics.py"

      - name: Upload diarization metric receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diarization-metric-crosscheck
          path: ${{ runner.temp }}/diarization-metric-crosscheck
          if-no-files-found: ignore

      # Run core's own tests on Linux too — cargo does not run dependency
      # crates' tests, so without these steps core is only compile-checked
      # here (its tests would run on macOS/Windows only).
      - name: Cargo test (sagascript-core, no features)
        working-directory: src-tauri
        run: cargo test -p sagascript-core

      - name: Cargo test (sagascript-core, with record)
        working-directory: src-tauri
        run: cargo test -p sagascript-core --features record

      # Regression guard for the no-ALSA property (#66): the batch-only CLI
      # dependency tree must contain neither cpal nor alsa. (grep -c would
      # exit 1 on zero matches and fail the step, hence the if/grep -q form.)
      - name: Assert batch-only CLI has no ALSA/cpal dependency
        working-directory: src-tauri
        run: |
          if cargo tree -p sagascript-cli --no-default-features -e normal | grep -qiE 'alsa|cpal'; then
            echo "ERROR: cpal/ALSA leaked into the batch-only dependency tree:"
            cargo tree -p sagascript-cli --no-default-features -e normal | grep -iE 'alsa|cpal'
            exit 1
          fi
          echo "OK: no cpal/ALSA in batch-only tree"

      # The Rust<->Swift engine-host wire format (#357). No CI lane runs
      # `cargo test --workspace` and cargo never runs a dependency's tests, so
      # these otherwise ran only in the release gate and windows-package.yml.
      - name: Cargo test (sagascript-engine-protocol)
        working-directory: src-tauri
        run: cargo test -p sagascript-engine-protocol

      # The ONNX Runtime engine host is a separate Cargo workspace (#357), so
      # the workspace steps above never reach it; windows-package.yml only
      # builds it. Its tests include the context-biasing parity vectors shared
      # with the Swift host. ort's `load-dynamic` means neither step needs an
      # ONNX Runtime binary. rustfmt is gated in "Check Rust formatting".
      - name: Cargo test (ORT engine host)
        working-directory: src-tauri/engine-host/ort
        run: cargo test --locked

      - name: Cargo clippy (ORT engine host)
        working-directory: src-tauri/engine-host/ort
        run: cargo clippy --all-targets --locked -- -D warnings

      # Release-profile guard (#357): `release_build_ignores_the_real_environment`
      # proves a release build ignores SAGASCRIPT_ENGINE_HOST and
      # SAGASCRIPT_PIANISSIMO_MODEL_DIR. It is compiled only without
      # debug_assertions and the `dev-overrides` feature, so every debug
      # `cargo test` above leaves it out.
      - name: Cargo test (sagascript-core, release-profile dev-override guard)
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo test --release -p sagascript-core --lib dev_overrides 2>&1 | tee "$RUNNER_TEMP/release-guard.log"
          # cargo test exits 0 when the filter matches nothing: prove the guard ran.
          grep -q 'release_build_ignores_the_real_environment ... ok' "$RUNNER_TEMP/release-guard.log"

  # Minimum supported Rust version (#353). `rust-version` in
  # src-tauri/Cargo.toml (and engine-host/ort) is a promise to people building
  # from source; compile with exactly that toolchain so it stays true. Linux is
  # the cheapest lane that builds every workspace member. RUSTUP_TOOLCHAIN
  # overrides the newer development pin in rust-toolchain.toml.
  msrv-linux:
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            build-essential \
            file

      - name: Install the declared MSRV toolchain
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml)
          ort_msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' src-tauri/engine-host/ort/Cargo.toml)
          test -n "$msrv"
          test "$msrv" = "$ort_msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
          echo "Checking against Rust $msrv"

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            src-tauri/engine-host/ort
          shared-key: sagascript-msrv

      - name: Install npm dependencies
        run: npm ci

      # tauri::generate_context! embeds ../dist, so the app crate needs it.
      - name: Build frontend
        run: npm run build

      - name: Cargo check (workspace) on MSRV
        working-directory: src-tauri
        run: cargo check --workspace --locked

      - name: Cargo check (headless CLI, batch-only) on MSRV
        working-directory: src-tauri
        run: cargo check -p sagascript-cli --no-default-features --locked

      - name: Cargo check (ORT engine host) on MSRV
        working-directory: src-tauri/engine-host/ort
        run: cargo check --locked

  check-linux:
    needs: [scope, test-linux, msrv-linux]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      SCOPE_TRUSTED: ${{ needs.scope.outputs.scope_trusted }}
      DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
      LINUX_RESULT: ${{ needs.test-linux.result }}
      MSRV_RESULT: ${{ needs.msrv-linux.result }}
    steps:
      - name: Assert Linux CI lanes passed
        run: |
          test "$SCOPE_RESULT" = success
          test "$SCOPE_TRUSTED" = true
          if [ "$DOCS_ONLY" = true ]; then
            test "$LINUX_RESULT" = skipped
            test "$MSRV_RESULT" = skipped
          else
            test "$DOCS_ONLY" = false
            test "$LINUX_RESULT" = success
            test "$MSRV_RESULT" = success
          fi

  test-windows:
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Select evaluation Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Test offline dictation evaluation tooling
        run: python -m unittest discover -s scripts/dictation_eval -p 'test_*.py'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1; toolchain must match rust-toolchain.toml
        with:
          toolchain: 1.99.0
          components: clippy

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: sagascript-ci-checks

      - name: Test Windows build identity gates
        run: node --test scripts/test-ci-build-identity.mjs scripts/test-windows-release-identity.mjs scripts/test-windows-package-workflow.mjs scripts/test-release-promotion.mjs

      - name: Install npm dependencies
        run: npm ci

      # The whole Node test suite on a Windows checkout (#357), not only the
      # build identity gates above (which stay first so they fail before any
      # npm or Cargo work). Platform-only cases skip themselves.
      - name: Test frontend suite
        run: npm run test:frontend

      - name: Build frontend
        run: npm run build

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Separate invocations preserve the core no-features build; combining
      # package flags would unify features with the CLI defaults.
      - name: Cargo test (sagascript-core, no features)
        working-directory: src-tauri
        run: cargo test -p sagascript-core

      - name: Cargo test (sagascript-cli)
        working-directory: src-tauri
        run: cargo test -p sagascript-cli

      - name: Cargo clippy (sagascript-core, no features)
        working-directory: src-tauri
        run: cargo clippy -p sagascript-core --all-targets -- -D warnings

      - name: Cargo clippy (sagascript-cli)
        working-directory: src-tauri
        run: cargo clippy -p sagascript-cli --all-targets -- -D warnings

  build-windows:
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1; toolchain must match rust-toolchain.toml
        with:
          toolchain: 1.99.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: sagascript-ci-native

      - name: Cache downloaded models
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~\AppData\Roaming\Sagascript\Models
          key: windows-models-${{ hashFiles('src-tauri/crates/sagascript-core/src/settings/manager.rs', 'src-tauri/crates/sagascript-core/src/transcription/model.rs', 'src-tauri/crates/sagascript-core/src/diarization/model.rs') }}
          restore-keys: |
            windows-models-

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # PR validation needs the native release binary for the smoke tests, not
      # an installer. Full packaging, signing and notarization remain gated in
      # release.yml, so skipping bundling here removes duplicate work without
      # weakening native Windows coverage.

      - name: Build native release binary (no installer)
        run: npx tauri build --config scripts/tauri-ci-prebuilt.json --no-bundle

      - name: Verify native release binary
        run: |
          $binary = "src-tauri\target\release\sagascript.exe"
          if (-not (Test-Path -PathType Leaf $binary)) {
            throw "Missing native release binary: $binary"
          }

      # --- CLI smoke tests (Windows / PowerShell) ---

      - name: Smoke test — help and version
        run: |
          $env:BINARY = "src-tauri\target\release\sagascript.exe"
          & $env:BINARY --help
          & $env:BINARY transcribe --help
          & $env:BINARY record --help

      - name: Smoke test — config management
        run: |
          $env:BINARY = "src-tauri\target\release\sagascript.exe"
          & $env:BINARY config list
          & $env:BINARY config get language
          & $env:BINARY config set language sv
          $result = & $env:BINARY config get language
          if ($result -notmatch "sv") { throw "Expected 'sv'" }
          & $env:BINARY config reset language
          $result = & $env:BINARY config get language
          if ($result -notmatch "en") { throw "Expected 'en'" }
          & $env:BINARY config path

      - name: Smoke test — model listing and formats
        run: |
          $env:BINARY = "src-tauri\target\release\sagascript.exe"
          & $env:BINARY list-models
          & $env:BINARY formats

      - name: Smoke test — shell completions
        run: |
          $env:BINARY = "src-tauri\target\release\sagascript.exe"
          & $env:BINARY completions powershell | Out-Null

      # The two model smoke steps stay non-blocking (#357), but no longer
      # silently: a step's `conclusion` is reported AFTER continue-on-error, so
      # it read "success" while the transcription actually died after
      # "Encoding audio..." in about half of the runs since 2026-10-09 (masked
      # exit 1; suspected non-portable whisper.cpp build in the shared native
      # cache). The report step below turns every masked failure into a
      # warning annotation and a job-summary line until the cause is fixed.
      - name: Smoke test — download model and transcribe
        id: smoke_transcribe
        continue-on-error: true
        run: |
          $env:BINARY = "src-tauri\target\release\sagascript.exe"
          & $env:BINARY download-model nb-whisper-tiny
          $result = & $env:BINARY transcribe --language no --model nb-whisper-tiny test-audio/norwegian-short-3s.mp3
          Write-Host "Transcription: $result"
          if ($result -notmatch "(?i)stortinget") { throw "Expected 'stortinget' in output" }

      - name: Smoke test — transcribe with JSON output
        id: smoke_json
        continue-on-error: true
        shell: cmd
        run: |
          set BINARY=src-tauri\target\release\sagascript.exe
          %BINARY% transcribe --json --language no --model nb-whisper-tiny test-audio/norwegian-short-3s.mp3 > json_output.txt 2>nul
          type json_output.txt
          findstr /C:"text" json_output.txt
          findstr /C:"duration_seconds" json_output.txt
          findstr /C:"language" json_output.txt

      - name: Report masked smoke test failures
        if: ${{ always() }}
        shell: bash
        env:
          TRANSCRIBE_OUTCOME: ${{ steps.smoke_transcribe.outcome }}
          JSON_OUTCOME: ${{ steps.smoke_json.outcome }}
        run: |
          for pair in "download model and transcribe=$TRANSCRIBE_OUTCOME" "transcribe with JSON output=$JSON_OUTCOME"; do
            name=${pair%%=*}
            outcome=${pair##*=}
            echo "Windows smoke test — $name: $outcome" >> "$GITHUB_STEP_SUMMARY"
            if [ "$outcome" != success ]; then
              echo "::warning title=Windows smoke test failed (non-blocking)::Smoke test — $name: $outcome (masked by continue-on-error, see #357)"
            fi
          done

  check-windows:
    needs: [scope, test-windows, build-windows]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      SCOPE_TRUSTED: ${{ needs.scope.outputs.scope_trusted }}
      DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
      TEST_RESULT: ${{ needs.test-windows.result }}
      BUILD_RESULT: ${{ needs.build-windows.result }}
    steps:
      - name: Assert Windows CI lanes passed
        run: |
          test "$SCOPE_RESULT" = success
          test "$SCOPE_TRUSTED" = true
          if [ "$DOCS_ONLY" = true ]; then
            test "$TEST_RESULT" = skipped
            test "$BUILD_RESULT" = skipped
          else
            test "$DOCS_ONLY" = false
            test "$TEST_RESULT" = success
            test "$BUILD_RESULT" = success
          fi
