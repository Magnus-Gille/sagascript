name: CI

# Shared parts live once, outside this file (#358): .github/actions/setup (toolchain preamble),
# scripts/ci/cargo-gates.mjs (THE list of cargo gates; per-OS exclusions are documented there),
# scripts/ci/smoke-cli.mjs and scripts/ci/assert-lanes.mjs (the check-* aggregators). Branch
# protection requires check-macos and check-windows by name: keep both, `needs:` every lane of their OS.
# assert-lanes.mjs comes from the PR checkout, at the trust level of this file itself (contents: read, no secrets).
#
# Windows tests have one owner on a pull request: test-windows (x64), the required lane.
# windows-package.yml does not repeat `cargo test --workspace` and `cargo clippy --workspace` there
# (in its pwsh step a failure never failed the job); it keeps them for releases and manual runs,
# the only place ARM64 tests run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege (#354): read-only token; every job sets timeout-minutes.
permissions:
  contents: read

# Cancel superseded PR runs (#178); pushes (e.g. to `main`) get a unique group per run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Line-table backtraces without full debug information (rust-cache keys on CARGO_* variables).
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # Checks out the PR base so a PR cannot change the allowlist that decides whether native CI is
  # needed. Inline on purpose: the base may predate any script file (adoption), and a missing file
  # would fail the required checks instead of falling back to full CI. Pushes use --full.
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      scope_trusted: ${{ steps.classify.outputs.scope_trusted }}
      scope_classification: ${{ steps.classify.outputs.scope_classification }}
    steps:
      - name: Checkout scope policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          full_fallback() {
            echo '{"schema_version":1,"docs_only":false,"scope_trusted":true,"scope_classification":"full-required","reason":"scope-policy-or-commit-unavailable","changed_paths":[]}'
            {
              echo 'docs_only=false'
              echo 'scope_trusted=true'
              echo 'scope_classification=full-required'
            } >> "$GITHUB_OUTPUT"
          }

          if [ "$EVENT_NAME" = pull_request ]; then
            # An absent policy (adoption) or head commit (fork) safely runs the full CI lanes.
            if [ -f scripts/ci-docs-scope.mjs ] \
              && [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
              && [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
              && git cat-file -e "$PR_BASE_SHA^{commit}" \
              && git cat-file -e "$PR_HEAD_SHA^{commit}"; then
              node scripts/ci-docs-scope.mjs --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
            else
              full_fallback
            fi
          else
            node scripts/ci-docs-scope.mjs --full
          fi

  test-macos:
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          rust-components: clippy
          cache-key: sagascript-ci-checks
      - name: Test offline dictation evaluation tooling and diarization reference contracts
        run: |
          python -m unittest discover -s scripts/dictation_eval -p 'test_*.py'
          python -m unittest discover -s scripts/diarization_sv -p 'test_reference_dataset.py'
      - name: Frontend checks (npm audit, format, lint, unit tests, Node tests, types)
        run: |
          npm audit --audit-level=high
          npm run format:check
          npm run lint
          npm run test:unit
          npm run test:frontend
          npx svelte-check --tsconfig ./tsconfig.json
      - name: Test transcription result tabs in browser
        env:
          QA_OUTPUT_DIR: ${{ runner.temp }}/transcription-browser
        run: |
          npx playwright install chromium
          npm run test:browser
      - name: Upload browser regression diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transcription-browser-diagnostics
          path: ${{ runner.temp }}/transcription-browser
          if-no-files-found: ignore
      - name: Build frontend
        run: npm run build
      - name: Cargo gates
        run: node scripts/ci/cargo-gates.mjs --os macos
      # Model-free subset of the engine-host conformance (#367); the full run needs a Pianissimo
      # model and is in the release gate (release-build-macos.yml).
      - name: Build the Core ML engine host, check its revision, run the conformance subset
        run: |
          ./scripts/stage-engine-host.sh
          ./scripts/check-engine-host-identity.sh build/engine-host/sagascript-engine-host "$GITHUB_SHA"
          python scripts/engine-host-conformance.py build/engine-host/sagascript-engine-host --no-model
      # The tests use Swift Testing (Xcode 16+); the runner's default Xcode may be older.
      - name: Swift test (Core ML engine host)
        working-directory: src-tauri/engine-host/coreml
        run: |
          newest=$(find /Applications -maxdepth 1 -name "Xcode_*.app" | sort -V | tail -1)
          if [ -z "$newest" ]; then echo "No Xcode found in /Applications" >&2; exit 1; fi
          export DEVELOPER_DIR="$newest/Contents/Developer"
          echo "Swift tests with $newest"
          swift --version
          swift test

  build-macos:
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          cache-key: sagascript-ci-native
          native-build: "true"
      - name: Build frontend
        run: npm run build
      # The smoke tests need the binary, not an installer (packaging: release.yml).
      - name: Build native release binary (no installer)
        env:
          SAGASCRIPT_UPDATER_PUBKEY: ${{ vars.SAGASCRIPT_UPDATER_PUBKEY }}
        run: npx tauri build --config scripts/tauri-ci-prebuilt.json --no-bundle
      - name: Smoke tests (no model; model download, transcription, JSON and JSONL streams)
        run: |
          node scripts/ci/smoke-cli.mjs basic
          node scripts/ci/smoke-cli.mjs model

  check-macos:
    needs: [scope, test-macos, build-macos]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Assert macOS CI lanes passed
        run: node scripts/ci/assert-lanes.mjs

  test-linux:
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          rust-components: clippy, rustfmt
          linux-deps: "true"
          cache-key: sagascript-ci
          cache-workspaces: |
            src-tauri
            src-tauri/engine-host/ort
      - name: Test offline dictation evaluation tooling
        run: python -m unittest discover -s scripts/dictation_eval -p 'test_*.py'
      # The cargo-deny gates run first, before any compilation; rust-cache keeps the binary.
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2
      # tauri::generate_context! embeds ../dist, so the app crate needs it.
      - name: Build frontend
        run: npm run build
      - name: Cargo gates
        run: node scripts/ci/cargo-gates.mjs --os linux
      # Clippy policy lints (#356): counts must not rise above src-tauri/clippy-policy-baseline.json.
      # Re-lints only the workspace crates, after the gates above compiled the dependencies.
      - name: Clippy policy lints (counts must not rise)
        run: node scripts/clippy-policy.mjs
      - name: Test diarization reference and evidence contracts with native identity parity
        env:
          SAGASCRIPT_REFERENCE_CLI: ${{ github.workspace }}/src-tauri/target/debug/sagascript
        run: |
          python -m pip install -r scripts/diarization_sv/requirements-evaluation.txt
          test -x "$SAGASCRIPT_REFERENCE_CLI"
          python -m unittest discover -s scripts/diarization_sv -p 'test_*.py'
      - name: Cross-check native DER and JER against independent scorers
        run: |
          curl --fail --location --retry 2 \
            https://raw.githubusercontent.com/nryant/dscore/e02f949ac6592279300a2c33d03daf9e0c12fd27/scorelib/metrics.py \
            --output "$RUNNER_TEMP/dscore-metrics.py"
          # Verifies the pinned source SHA-256, loads only its numeric JER function.
          python scripts/diarization_sv/crosscheck_metrics.py \
            --binary "$GITHUB_WORKSPACE/src-tauri/target/debug/sagascript" \
            --scratch "$RUNNER_TEMP/diarization-metric-crosscheck" \
            --dscore-source "$RUNNER_TEMP/dscore-metrics.py"
      - name: Upload diarization metric receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diarization-metric-crosscheck
          path: ${{ runner.temp }}/diarization-metric-crosscheck
          if-no-files-found: ignore

  # Minimum supported Rust version (#353): `rust-version` is a promise to people building from
  # source, so compile with exactly that toolchain. The setup action installs it and exports
  # RUSTUP_TOOLCHAIN (over the pin in rust-toolchain.toml); the msrv profile refuses to run without it.
  msrv-linux:
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          python: "false"
          rust: msrv
          linux-deps: "true"
          cache-key: sagascript-msrv
          cache-workspaces: |
            src-tauri
            src-tauri/engine-host/ort
      - name: Build frontend
        run: npm run build
      - name: Cargo gates (MSRV profile)
        run: node scripts/ci/cargo-gates.mjs --profile msrv

  check-linux:
    needs: [scope, test-linux, msrv-linux]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Assert Linux CI lanes passed
        run: node scripts/ci/assert-lanes.mjs

  test-windows:
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          rust-components: clippy
          cache-key: sagascript-ci-checks
          cache-workspaces: |
            src-tauri
            src-tauri/engine-host/ort
          npm-ci: "false"
      # Before npm ci, so a build identity regression fails before any npm or Cargo work.
      - name: Test Windows build identity gates
        run: node --test scripts/test-ci-build-identity.mjs scripts/test-windows-release-identity.mjs scripts/test-windows-package-workflow.mjs scripts/test-release-promotion.mjs
      - name: Install npm dependencies
        run: npm ci
      # The whole Node suite on a Windows checkout (#357; CRLF line endings, which prettier.config.js
      # accepts here). bash, not pwsh: pwsh would report only the LAST native command's exit code.
      - name: Python and frontend checks (dictation tooling, Node tests, unit tests, format)
        shell: bash
        run: |
          python -m unittest discover -s scripts/dictation_eval -p 'test_*.py'
          npm run test:frontend
          npm run test:unit
          npm run format:check
      - name: Build frontend
        run: npm run build
      - name: Cargo gates
        run: node scripts/ci/cargo-gates.mjs --os windows

  build-windows:
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          cache-key: sagascript-ci-native
          native-build: "true"
      - name: Build frontend
        run: npm run build
      # The smoke tests need the binary, not an installer; packaging stays gated in release.yml.
      - name: Build native release binary (no installer)
        run: npx tauri build --config scripts/tauri-ci-prebuilt.json --no-bundle
      - name: Smoke test, tier 1 (no model)
        run: node scripts/ci/smoke-cli.mjs basic
      # Tier 2 is the only non-blocking step (#357): the transcription dies in about half of the
      # runs. continue-on-error masks the step's `conclusion`, so the report step below turns its
      # real `outcome` into a warning annotation and a job-summary line.
      - name: Smoke test, tier 2 (model download, transcription, JSON and JSONL streams)
        id: smoke_model
        continue-on-error: true
        run: node scripts/ci/smoke-cli.mjs model
      - name: Report masked smoke test failures
        if: ${{ always() }}
        shell: bash
        env:
          MODEL_OUTCOME: ${{ steps.smoke_model.outcome }}
        run: |
          echo "Windows smoke test, tier 2 (model): $MODEL_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          [ "$MODEL_OUTCOME" = success ] || echo "::warning title=Windows smoke test failed (non-blocking)::Tier 2 (model): $MODEL_OUTCOME, masked by continue-on-error (#357)"

  check-windows:
    needs: [scope, test-windows, build-windows]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Assert Windows CI lanes passed
        run: node scripts/ci/assert-lanes.mjs
