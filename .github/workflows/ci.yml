name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR runs (#178): pushes to a PR share one group, so a fix
# cancels the stale run instead of burning runner-minutes compiling it twice.
# Pushes (e.g. to `main`) get a unique group per run, so a newer push can
# neither cancel an in-progress run nor replace a pending one — with the
# default single-slot queue, same-group pending runs would otherwise be
# dropped. Never touches release.yml (tag builds must never cancel).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Keep source/line backtraces for CI failures without full variable/type debug
# information in every dependency and PDB. Release profiles are unchanged.
# rust-cache includes CARGO_* environment variables in its compatibility key.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # This job is deliberately dependency-free and checks out the PR base so a
  # PR cannot change the allowlist used to decide whether native CI is needed.
  # Pushes use --full because the workflow only runs on main and no comparison
  # range is needed to keep that required path fail-closed.
  scope:
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      scope_trusted: ${{ steps.classify.outputs.scope_trusted }}
      scope_classification: ${{ steps.classify.outputs.scope_classification }}
    steps:
      - name: Checkout scope policy
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          full_fallback() {
            echo '{"schema_version":1,"docs_only":false,"scope_trusted":true,"scope_classification":"full-required","reason":"scope-policy-or-commit-unavailable","changed_paths":[]}'
            {
              echo 'docs_only=false'
              echo 'scope_trusted=true'
              echo 'scope_classification=full-required'
            } >> "$GITHUB_OUTPUT"
          }

          if [ "$EVENT_NAME" = pull_request ]; then
            # The policy is read from the base checkout. During adoption the
            # base may predate this script; a fork head may also be absent from
            # the base repository. Both cases safely run the full CI lanes.
            if [ -f scripts/ci-docs-scope.mjs ] \
              && [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
              && [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
              && git cat-file -e "$PR_BASE_SHA^{commit}" \
              && git cat-file -e "$PR_HEAD_SHA^{commit}"; then
              node scripts/ci-docs-scope.mjs --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
            else
              full_fallback
            fi
          else
            node scripts/ci-docs-scope.mjs --full
          fi

  test-macos:
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select evaluation Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Test offline dictation evaluation tooling
        run: python -m unittest discover -s scripts/dictation_eval -p 'test_*.py'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: sagascript-ci-checks

      - name: Install npm dependencies
        run: npm ci

      - name: Test frontend lifecycle helpers
        run: npm run test:frontend

      - name: Build frontend
        run: npm run build

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      # Separate invocations preserve the core no-features build; combining
      # package flags would unify features with the CLI defaults.
      - name: Cargo test (sagascript-core, no features)
        working-directory: src-tauri
        run: cargo test -p sagascript-core

      - name: Cargo test (sagascript-cli)
        working-directory: src-tauri
        run: cargo test -p sagascript-cli

      - name: Cargo clippy (sagascript-core, no features)
        working-directory: src-tauri
        run: cargo clippy -p sagascript-core --all-targets -- -D warnings

      - name: Cargo clippy (sagascript-cli)
        working-directory: src-tauri
        run: cargo clippy -p sagascript-cli --all-targets -- -D warnings

      # Core defaults to no features. CLI defaults already include diarization
      # and are covered above; core needs this explicit feature matrix.
      - name: Cargo check (sagascript-core, diarization)
        working-directory: src-tauri
        run: cargo check -p sagascript-core --features diarization

      - name: Cargo test (sagascript-core, diarization)
        working-directory: src-tauri
        run: cargo test -p sagascript-core --features diarization

      - name: Cargo clippy (sagascript-core, diarization)
        working-directory: src-tauri
        run: cargo clippy -p sagascript-core --features diarization --all-targets -- -D warnings

      - name: Svelte check
        run: npx svelte-check --tsconfig ./tsconfig.json

  build-macos:
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select evaluation Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: sagascript-ci-native

      - name: Cache downloaded models
        uses: actions/cache@v5
        with:
          path: ~/Library/Application Support/Sagascript/Models
          key: macos-models-${{ hashFiles('src-tauri/crates/sagascript-core/src/settings/manager.rs', 'src-tauri/crates/sagascript-core/src/transcription/model.rs', 'src-tauri/crates/sagascript-core/src/diarization/model.rs') }}
          restore-keys: |
            macos-models-

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # PR validation needs the native release binary for the smoke tests, not
      # an installer. Full packaging, signing and notarization remain gated in
      # release.yml, so skipping bundling here removes duplicate work without
      # weakening native macOS coverage.

      - name: Build native release binary (no installer)
        run: npx tauri build --config scripts/tauri-ci-prebuilt.json --no-bundle

      - name: Verify native release binary
        run: |
          BINARY=src-tauri/target/release/sagascript
          [[ -x "$BINARY" ]]
          file "$BINARY"

      # --- Tier 1: CLI smoke tests (no model needed) ---

      - name: Smoke test — help and version
        run: |
          BINARY=src-tauri/target/release/sagascript
          $BINARY --help
          $BINARY transcribe --help
          $BINARY record --help

      - name: Smoke test — config management
        run: |
          BINARY=src-tauri/target/release/sagascript
          $BINARY config list
          $BINARY config get language
          $BINARY config set language sv
          $BINARY config get language | grep -q sv
          $BINARY config reset language
          $BINARY config get language | grep -q en
          $BINARY config path

      - name: Smoke test — model listing and formats
        run: |
          BINARY=src-tauri/target/release/sagascript
          $BINARY list-models
          $BINARY formats

      - name: Smoke test — shell completions
        run: |
          BINARY=src-tauri/target/release/sagascript
          $BINARY completions zsh > /dev/null
          $BINARY completions bash > /dev/null

      # --- Tier 2: Model download + transcription ---

      - name: Smoke test — download model and transcribe
        run: |
          BINARY=src-tauri/target/release/sagascript
          $BINARY download-model nb-whisper-tiny
          RESULT=$($BINARY transcribe --language no --model nb-whisper-tiny test-audio/norwegian-short-3s.mp3)
          echo "Transcription: $RESULT"
          echo "$RESULT" | grep -iq "stortinget"

      - name: Smoke test — transcribe with JSON output
        run: |
          BINARY=src-tauri/target/release/sagascript
          STDOUT="$RUNNER_TEMP/transcription-smoke.json"
          STDERR="$RUNNER_TEMP/transcription-smoke.stderr"
          $BINARY transcribe --json --language no --model nb-whisper-tiny \
            test-audio/norwegian-short-3s.mp3 > "$STDOUT" 2> "$STDERR"
          python3 scripts/verify-json-cli-streams.py "$STDOUT" "$STDERR"

  check-macos:
    needs: [scope, test-macos, build-macos]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      SCOPE_TRUSTED: ${{ needs.scope.outputs.scope_trusted }}
      DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
      TEST_RESULT: ${{ needs.test-macos.result }}
      BUILD_RESULT: ${{ needs.build-macos.result }}
    steps:
      - name: Assert macOS CI lanes passed
        run: |
          test "$SCOPE_RESULT" = success
          test "$SCOPE_TRUSTED" = true
          if [ "$DOCS_ONLY" = true ]; then
            test "$TEST_RESULT" = skipped
            test "$BUILD_RESULT" = skipped
          else
            test "$DOCS_ONLY" = false
            test "$TEST_RESULT" = success
            test "$BUILD_RESULT" = success
          fi

  test-linux:
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select evaluation Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Test offline dictation evaluation tooling
        run: python -m unittest discover -s scripts/dictation_eval -p 'test_*.py'

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            build-essential \
            file \
            xdotool

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      # Same rust-cache scheme as the macOS job (#178); the shared key spans
      # branches while rust-cache keeps OS/target entries separate.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: sagascript-ci

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # GUI build: compiles the cfg(target_os = "linux") Tauri path so it can't
      # silently break on a future PR (the macOS/Windows runners never see it).
      # The bare invocation covers the root (app) package, which pulls in
      # sagascript-core with the `record` feature.
      - name: Cargo check (GUI app)
        working-directory: src-tauri
        run: cargo check

      - name: Cargo clippy (GUI app)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      # Headless CLI (no Tauri) — the sagascript-cli member crate. Default
      # features include `record` (cpal/ALSA); the --no-default-features runs
      # cover the pure batch-transcribe build, which must need no ALSA.
      - name: Cargo check (headless CLI, with record)
        working-directory: src-tauri
        run: cargo check -p sagascript-cli

      - name: Cargo check (headless CLI, batch-only)
        working-directory: src-tauri
        run: cargo check -p sagascript-cli --no-default-features

      - name: Cargo clippy (headless CLI, batch-only)
        working-directory: src-tauri
        run: cargo clippy -p sagascript-cli --all-targets --no-default-features -- -D warnings

      - name: Cargo test (headless CLI, batch-only)
        working-directory: src-tauri
        run: cargo test -p sagascript-cli --no-default-features

      # Run core's own tests on Linux too — cargo does not run dependency
      # crates' tests, so without these steps core is only compile-checked
      # here (its tests would run on macOS/Windows only).
      - name: Cargo test (sagascript-core, no features)
        working-directory: src-tauri
        run: cargo test -p sagascript-core

      - name: Cargo test (sagascript-core, with record)
        working-directory: src-tauri
        run: cargo test -p sagascript-core --features record

      # Regression guard for the no-ALSA property (#66): the batch-only CLI
      # dependency tree must contain neither cpal nor alsa. (grep -c would
      # exit 1 on zero matches and fail the step, hence the if/grep -q form.)
      - name: Assert batch-only CLI has no ALSA/cpal dependency
        working-directory: src-tauri
        run: |
          if cargo tree -p sagascript-cli --no-default-features -e normal | grep -qiE 'alsa|cpal'; then
            echo "ERROR: cpal/ALSA leaked into the batch-only dependency tree:"
            cargo tree -p sagascript-cli --no-default-features -e normal | grep -iE 'alsa|cpal'
            exit 1
          fi
          echo "OK: no cpal/ALSA in batch-only tree"

  check-linux:
    needs: [scope, test-linux]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      SCOPE_TRUSTED: ${{ needs.scope.outputs.scope_trusted }}
      DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
      LINUX_RESULT: ${{ needs.test-linux.result }}
    steps:
      - name: Assert Linux CI lane passed
        run: |
          test "$SCOPE_RESULT" = success
          test "$SCOPE_TRUSTED" = true
          if [ "$DOCS_ONLY" = true ]; then
            test "$LINUX_RESULT" = skipped
          else
            test "$DOCS_ONLY" = false
            test "$LINUX_RESULT" = success
          fi

  test-windows:
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select evaluation Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Test offline dictation evaluation tooling
        run: python -m unittest discover -s scripts/dictation_eval -p 'test_*.py'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: sagascript-ci-checks

      - name: Test Windows build identity gates
        run: node --test scripts/test-ci-build-identity.mjs scripts/test-windows-release-identity.mjs scripts/test-windows-package-workflow.mjs

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      # Separate invocations preserve the core no-features build; combining
      # package flags would unify features with the CLI defaults.
      - name: Cargo test (sagascript-core, no features)
        working-directory: src-tauri
        run: cargo test -p sagascript-core

      - name: Cargo test (sagascript-cli)
        working-directory: src-tauri
        run: cargo test -p sagascript-cli

      - name: Cargo clippy (sagascript-core, no features)
        working-directory: src-tauri
        run: cargo clippy -p sagascript-core --all-targets -- -D warnings

      - name: Cargo clippy (sagascript-cli)
        working-directory: src-tauri
        run: cargo clippy -p sagascript-cli --all-targets -- -D warnings

  build-windows:
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: sagascript-ci-native

      - name: Cache downloaded models
        uses: actions/cache@v5
        with:
          path: ~\AppData\Roaming\Sagascript\Models
          key: windows-models-${{ hashFiles('src-tauri/crates/sagascript-core/src/settings/manager.rs', 'src-tauri/crates/sagascript-core/src/transcription/model.rs', 'src-tauri/crates/sagascript-core/src/diarization/model.rs') }}
          restore-keys: |
            windows-models-

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # PR validation needs the native release binary for the smoke tests, not
      # an installer. Full packaging, signing and notarization remain gated in
      # release.yml, so skipping bundling here removes duplicate work without
      # weakening native Windows coverage.

      - name: Build native release binary (no installer)
        run: npx tauri build --config scripts/tauri-ci-prebuilt.json --no-bundle

      - name: Verify native release binary
        run: |
          $binary = "src-tauri\target\release\sagascript.exe"
          if (-not (Test-Path -PathType Leaf $binary)) {
            throw "Missing native release binary: $binary"
          }

      # --- CLI smoke tests (Windows / PowerShell) ---

      - name: Smoke test — help and version
        run: |
          $env:BINARY = "src-tauri\target\release\sagascript.exe"
          & $env:BINARY --help
          & $env:BINARY transcribe --help
          & $env:BINARY record --help

      - name: Smoke test — config management
        run: |
          $env:BINARY = "src-tauri\target\release\sagascript.exe"
          & $env:BINARY config list
          & $env:BINARY config get language
          & $env:BINARY config set language sv
          $result = & $env:BINARY config get language
          if ($result -notmatch "sv") { throw "Expected 'sv'" }
          & $env:BINARY config reset language
          $result = & $env:BINARY config get language
          if ($result -notmatch "en") { throw "Expected 'en'" }
          & $env:BINARY config path

      - name: Smoke test — model listing and formats
        run: |
          $env:BINARY = "src-tauri\target\release\sagascript.exe"
          & $env:BINARY list-models
          & $env:BINARY formats

      - name: Smoke test — shell completions
        run: |
          $env:BINARY = "src-tauri\target\release\sagascript.exe"
          & $env:BINARY completions powershell | Out-Null

      - name: Smoke test — download model and transcribe
        continue-on-error: true  # Model download/GPU availability varies across CI runners
        run: |
          $env:BINARY = "src-tauri\target\release\sagascript.exe"
          & $env:BINARY download-model nb-whisper-tiny
          $result = & $env:BINARY transcribe --language no --model nb-whisper-tiny test-audio/norwegian-short-3s.mp3
          Write-Host "Transcription: $result"
          if ($result -notmatch "(?i)stortinget") { throw "Expected 'stortinget' in output" }

      - name: Smoke test — transcribe with JSON output
        continue-on-error: true  # Model download/GPU availability varies across CI runners
        shell: cmd
        run: |
          set BINARY=src-tauri\target\release\sagascript.exe
          %BINARY% transcribe --json --language no --model nb-whisper-tiny test-audio/norwegian-short-3s.mp3 > json_output.txt 2>nul
          type json_output.txt
          findstr /C:"text" json_output.txt
          findstr /C:"duration_seconds" json_output.txt
          findstr /C:"language" json_output.txt

  check-windows:
    needs: [scope, test-windows, build-windows]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      SCOPE_TRUSTED: ${{ needs.scope.outputs.scope_trusted }}
      DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
      TEST_RESULT: ${{ needs.test-windows.result }}
      BUILD_RESULT: ${{ needs.build-windows.result }}
    steps:
      - name: Assert Windows CI lanes passed
        run: |
          test "$SCOPE_RESULT" = success
          test "$SCOPE_TRUSTED" = true
          if [ "$DOCS_ONLY" = true ]; then
            test "$TEST_RESULT" = skipped
            test "$BUILD_RESULT" = skipped
          else
            test "$DOCS_ONLY" = false
            test "$TEST_RESULT" = success
            test "$BUILD_RESULT" = success
          fi
