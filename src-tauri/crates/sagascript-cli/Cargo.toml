[package]
name = "sagascript-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless CLI for Sagascript: transcribe, record, and manage models from the terminal"
build = "build.rs"

# The binary keeps the `sagascript` name so the headless install UX is
# unchanged (clap's command name, completions, and manpages all say
# "sagascript"). The Tauri app crate produces a bin with the same name;
# see CONTRIBUTING.md for the target/release/sagascript last-build-wins note.
[[bin]]
name = "sagascript"
path = "src/main.rs"

[dependencies]
sagascript-core = { path = "../sagascript-core" }
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"
clap_mangen = "0.2"
indicatif = "0.17"
arboard = "3"
uuid = { version = "1", features = ["v4"] }
unicode-width = "0.2"
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# SIGINT/SIGTERM handling for `record` and cooperative cancellation of file
# transcription (#234); always on, including the lean batch build.
ctrlc = { version = "3", features = ["termination"] }

[target.'cfg(unix)'.dependencies]
# Distinguishes SIGINT (exit 130) from SIGTERM (exit 143) for cancelled transcription.
signal-hook = "0.3"

[features]
# `diarization` is default-on for discoverability (#81): a default build must
# show `--diarize` in --help, or users never learn it exists (#75). It adds
# ~23 MB of statically-linked ONNX Runtime; the lean batch build
# (`--no-default-features`) strips it along with `record`.
default = ["record", "diarization"]
record = ["sagascript-core/record"]
diarization = ["sagascript-core/diarization"]
# Development builds only: honor SAGASCRIPT_ENGINE_HOST / SAGASCRIPT_PIANISSIMO_MODEL_DIR in release.
dev-overrides = ["sagascript-core/dev-overrides"]

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
