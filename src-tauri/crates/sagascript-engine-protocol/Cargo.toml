[package]
name = "sagascript-engine-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wire types for the sagascript-engine-host JSON Lines protocol (see docs/engine-host-protocol.md)"

[features]
# Golden-transcript tooling (`golden` module) for other crates' tests, such as the ONNX engine
# host's protocol replay. Never enabled in a shipped build.
golden = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints]
workspace = true
