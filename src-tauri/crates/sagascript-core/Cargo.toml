[package]
name = "sagascript-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core transcription engine for Sagascript: audio decode/capture, Whisper backend, settings, diarization"

# Test double for the engine-host protocol; only used by tests/engine_host.rs
# (cargo builds it for `cargo test`; nothing depends on it at runtime).
[[bin]]
name = "sagascript-fake-engine-host"
path = "tests/support/fake_engine_host.rs"
test = false
doc = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
# Same reqwest and TLS as the app (#355): 0.13 over the platform TLS stack
# (native-tls without ALPN, so HTTP/1.1), as reqwest 0.12's defaults gave
# model downloads. See the comment in src-tauri/Cargo.toml.
reqwest = { version = "0.13", default-features = false, features = ["native-tls-no-alpn", "system-proxy", "json", "stream"] }
dirs = "6"
fs2 = "0.4"
futures-util = "0.3"
sha2 = "0.10"
num_cpus = "1"
symphonia = { version = "0.5", features = ["aac", "alac", "flac", "mp3", "pcm", "vorbis", "isomp4", "mkv", "ogg"] }
rubato = "0.14"
regex = "1"
sagascript-engine-protocol = { path = "../sagascript-engine-protocol" }
tempfile = "3"
# 9.0.4 is the floor: 9.0.0 clears RUSTSEC-2026-0367/0368/0369, and 9.0.1-9.0.4
# add symlink-extraction fixes and the `enclosed_name` hardening that
# pianissimo_model::extract_archive's own path guard relies on.
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }

# Live audio capture (optional): a pure batch-transcribe build
# (`--no-default-features` on sagascript-cli) needs no cpal — and on Linux, no ALSA.
cpal = { version = "0.15", optional = true }

# Diarization (optional, behind feature flag)
ort = { version = "2.0.0-rc.12", features = ["ndarray"], optional = true }
rustfft = { version = "6", optional = true }
kodama = { version = "0.2", optional = true }
ndarray = { version = "0.17", optional = true }

# fsync(2) as the fallback for volumes that reject F_FULLFSYNC, which is all
# std's `sync_all` does on Apple platforms (fsutil.rs). Already in the graph.
[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"

# whisper-rs is declared per-target because macOS enables Metal/CoreML;
# Windows and Linux use the CPU backend (Vulkan is a separate, currently-broken opt-in).
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"
whisper-rs = { version = "0.15", features = ["coreml", "metal", "tracing_backend"] }

[target.'cfg(target_os = "windows")'.dependencies]
whisper-rs = { version = "0.15", features = ["tracing_backend"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
whisper-rs = { version = "0.15", features = ["tracing_backend"] }

[features]
default = []
record = ["dep:cpal"]
diarization = ["dep:ort", "dep:rustfft", "dep:kodama", "dep:ndarray"]
# Honor SAGASCRIPT_ENGINE_HOST / SAGASCRIPT_PIANISSIMO_MODEL_DIR in a release build.
# Off by default: signed builds must not trust the environment for the sidecar or model.
dev-overrides = []
# Test fixtures made of core types (`sagascript_core::test_support`, #363) for
# the tests of the crates above core, which enable it as a dev-dependency.
# Core's own unit tests get the module through cfg(test). Never in a release build.
test-support = []

[dev-dependencies]
sagascript-testsupport = { path = "../sagascript-testsupport" }
# Captures the log lines a test expects (fsutil's warn-versus-debug choices).
tracing-subscriber = "0.3"

[lints]
workspace = true

[[example]]
name = "diarize_eval"
required-features = ["diarization"]
