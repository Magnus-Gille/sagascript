# Standalone workspace: this host pins ort 2.0.0-rc.13 (load-dynamic), while the main
# workspace keeps ort rc.12 for diarization. Keeping it separate leaves the main
# Cargo.lock untouched. Keep `version` in step with the app release version.
[workspace]

[package]
name = "sagascript-engine-host-ort"
version = "1.4.1"
edition = "2021"
license = "MIT"
description = "ONNX Runtime (CPU) engine host for Pianissimo, protocol v1 (see docs/engine-host-protocol.md)"
build = "build.rs"

[[bin]]
name = "sagascript-engine-host-ort"
path = "src/main.rs"

[dependencies]
sagascript-engine-protocol = { path = "../../crates/sagascript-engine-protocol" }
serde_json = "1"
# The ONNX Runtime shared library is loaded at run time (ORT_DYLIB_PATH or next to the
# executable), so building needs no ORT binary and works on every CI platform. Keep
# default-features off: the defaults enable `download-binaries`, which has no CPU-only
# prebuilt for aarch64-apple-darwin / aarch64-pc-windows-msvc.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27"] }
memory-stats = "1"
libloading = "0.9"

# Windows only: restrict the DLL search path (SetDefaultDllDirectories) and load the ONNX
# Runtime DLLs by absolute path. 0.52 is already in Cargo.lock via other dependencies.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[features]
# Honour ORT_DYLIB_PATH in release builds too (always honoured in debug builds). Off by default
# so a shipped host only ever loads the ONNX Runtime DLL beside it.
dev-overrides = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
